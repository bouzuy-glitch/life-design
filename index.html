<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIFE DESIGN</title>
<meta name="description" content="自分専用の資産管理・人生設計アプリ">
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LIFE DESIGN">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f2; --surface:#fcfcfb; --surface-2:#eef0ec; --line:#dfe1dc; --line-2:#c9ccc5;
  --ink:#161b22; --ink-2:#4c5157; --ink-3:#7a7f84;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --base-line:#8b8f94; --band:rgba(42,120,214,.10);
  --up:#1a7f4b; --down:#c2413b; --warn:#a15c00; --warn-soft:#fdf1dc; --info-soft:#e8eef7;
  --radius:14px; --shadow:0 1px 2px rgba(20,24,30,.05),0 2px 10px rgba(20,24,30,.04);
  --gutter:max(16px, env(safe-area-inset-left));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111418; --surface:#1a1d21; --surface-2:#22262b; --line:#2d3237; --line-2:#3b4147;
    --ink:#eef0f2; --ink-2:#b9bec4; --ink-3:#8a9097;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1d2e45;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --base-line:#8a9097; --band:rgba(57,135,229,.16);
    --up:#4cc38a; --down:#f07b74; --warn:#e3a24a; --warn-soft:#3a2d17; --info-soft:#1c2633;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111418; --surface:#1a1d21; --surface-2:#22262b; --line:#2d3237; --line-2:#3b4147;
  --ink:#eef0f2; --ink-2:#b9bec4; --ink-3:#8a9097;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1d2e45;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --base-line:#8a9097; --band:rgba(57,135,229,.16);
  --up:#4cc38a; --down:#f07b74; --warn:#e3a24a; --warn-soft:#3a2d17; --info-soft:#1c2633;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding:0 var(--gutter);padding-right:max(16px, env(safe-area-inset-right))}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:8px;height:54px}
.brand{font-weight:700;letter-spacing:.14em;font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:500;letter-spacing:.02em;font-size:10.5px;color:var(--ink-3);margin-top:-3px}
.top .sp{flex:1}
.chip-status{font-size:11.5px;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.chip-status.warn{background:var(--warn-soft);color:var(--warn)}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:58px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--ink-3);min-height:44px}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
main{padding:14px 0 calc(90px + env(safe-area-inset-bottom))}

/* layout */
h1{font-size:21px;margin:4px 0 2px;letter-spacing:.02em}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:14px 0 8px;color:var(--ink-2)}
.sub{color:var(--ink-3);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:720px){.grid-md-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid-md-2>.card{margin:0}}
.hero-label{font-size:12.5px;color:var(--ink-2)}
.hero-num{font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:2px 0}
.hero-num .u{font-size:16px;font-weight:600;margin-left:2px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--ink-2)}
.stat .v{font-size:17px;font-weight:650;overflow-wrap:anywhere}
.grid3 .stat{padding:8px 7px}
.grid3 .stat .v{font-size:12.5px !important;white-space:nowrap;overflow-wrap:normal;letter-spacing:-.02em}
@media (min-width:420px){.grid3 .stat .v{font-size:14px !important}}
.stat .d{font-size:12px}
.up{color:var(--up)} .down{color:var(--down)}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);vertical-align:1px;white-space:nowrap}
.badge.ok{border-color:transparent;background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}
.badge.est{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.badge.na{border-color:var(--line-2);color:var(--ink-3)}
.badge.acc{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--info-soft);border-radius:10px;padding:9px 12px;margin:10px 0}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.muted{color:var(--ink-3)}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

/* buttons / inputs */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 45%,var(--line))}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;margin:6px 0 4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-height:38px;border:0;background:transparent;border-radius:9px;font-size:13.5px;color:var(--ink-2);white-space:nowrap;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.08)}
label.f{display:block;margin:10px 0}
label.f>span{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:8px 11px;font-size:16px}
textarea.inp{min-height:70px}
.inp:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0;border-color:var(--accent)}
.inp.r{text-align:right}
input[type=range]{width:100%;height:32px;accent-color:var(--accent)}
.unit-wrap{position:relative}
.unit-wrap .inp{padding-right:52px}
.unit-wrap em{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12.5px;color:var(--ink-3);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip .x{font-size:15px;color:var(--ink-3);margin-left:2px}

/* lists */
.list{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);min-height:52px}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--ink-3)}
.li .v{text-align:right;font-weight:600}
.li.tap{cursor:pointer}
.li.tap:active{background:var(--surface-2)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}

/* monthly input cards */
.mi{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--surface)}
.mi.carry{opacity:.78}
.mi .hd{display:flex;align-items:flex-start;gap:8px}
.mi .hd .nm{flex:1;font-weight:650}
.mi .hd .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3)}
.mi .f3{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;margin-top:8px}
.mi .f3 label span{font-size:11px;color:var(--ink-3);display:block;margin-bottom:2px}
.mi .f3 .inp{min-height:42px;padding:6px 24px 6px 6px;text-align:right}
.mi .f3 .unit-wrap em{right:7px;font-size:11px}
.mi .f3 .inp.auto{color:var(--accent);background:var(--accent-soft);border-style:dashed}
.autotag{font-size:10px;font-weight:600;color:var(--accent);margin-left:4px}
.mi .dv{font-size:12px;color:var(--ink-2);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
.totals{border-color:var(--line-2)}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th{font-weight:600;color:var(--ink-2);font-size:12px;background:var(--surface)}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
table.t tr.sum td{font-weight:700;border-top:2px solid var(--line-2)}
table.t td.hl,table.t th.hl{background:var(--accent-soft)}

/* charts */
.chart{position:relative;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--ink-3);font-size:10.5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin:2px 0 6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.box{height:10px;width:10px;border-radius:3px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:9px;padding:7px 9px;font-size:12px;line-height:1.45;white-space:nowrap;z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.18);transform:translateX(-50%)}
.tip b{font-weight:650}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.bar-h{display:grid;grid-template-columns:7.5em 1fr 6.5em;gap:8px;align-items:center;font-size:12.5px;margin:7px 0}
.bar-h .track{height:14px;position:relative}
.bar-h .fill{position:absolute;top:0;height:14px;border-radius:4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.38);z-index:50;opacity:0;transition:opacity .18s;display:none}
.scrim.on{display:block;opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet .wrap{max-width:620px;padding-top:6px;padding-bottom:18px}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:6px auto 4px}
.sheet .sh-hd{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);padding:8px 0;z-index:2}
.sheet .sh-ft{display:flex;gap:8px;margin-top:14px}
.sheet .sh-ft .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
.empty{text-align:center;padding:26px 8px;color:var(--ink-3)}
.welcome{padding:22px 0}
.welcome .logo{font-size:28px;font-weight:800;letter-spacing:.18em}
.loading{padding:60px 0;text-align:center;color:var(--ink-3)}
details.more summary{cursor:pointer;color:var(--accent);font-size:13.5px;padding:8px 0;min-height:36px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
.ai-msg{border-radius:14px;padding:12px 14px;margin:10px 0}
.ai-q{background:var(--accent);color:var(--accent-ink);margin-left:18%;border-bottom-right-radius:4px}
.ai-a{background:var(--surface);border:1px solid var(--line);margin-right:6%;border-bottom-left-radius:4px}
.ai-a h4{margin:8px 0 4px;font-size:12.5px;color:var(--ink-2)}
.ai-a h4:first-child{margin-top:0}
.evidence{border:1px dashed var(--line-2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink-2);margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;text-align:right}
.pill-diff{font-weight:650}
@media (min-width:720px){ .hero-num{font-size:40px} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">LIFE DESIGN<small>資産管理・人生設計（試作品）</small></div>
    <div class="sp"></div>
    <span id="saveStatus" class="chip-status">読み込み中…</span>
    <button class="icon-btn" data-act="go" data-to="ai" aria-label="AI ADVISOR">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10h.01M12 10h.01M15 10h.01"/></svg>
    </button>
    <button class="icon-btn" data-act="go" data-to="prefs" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main><div class="wrap" id="view"><div class="loading">読み込み中…</div></div></main>

<nav class="tabs" aria-label="メインメニュー">
  <div class="wrap">
    <button class="tab" data-act="go" data-to="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>ホーム</button>
    <button class="tab" data-act="go" data-to="assets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>資産</button>
    <button class="tab" data-act="go" data-to="life"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M17 7.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2.2 2.6 5 3.3 5 1.6 5 3.6-2.2 3.1-5 3.1-5-1.2-5-3.1"/></svg>収支</button>
    <button class="tab" data-act="go" data-to="future"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg>未来</button>
    <button class="tab" data-act="go" data-to="ins"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>保険</button>
  </div>
</nav>

<div class="scrim" id="scrim" data-act="sheet-close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="wrap" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/*!
 * LIFE DESIGN 計算エンジン v0.5.0（仕様書 Ver.4.5 第3・4・5・6・7・8章）
 * 画面・保存先から独立した純粋関数のみ。同じ入力からは必ず同じ結果を返す。
 * ブラウザでは window.LDEngine、Node では module.exports として使う。
 * 本番（Next.js / TypeScript）へはこのファイルをそのまま移植できる構成。
 * 金額の単位はすべて円。率は小数（3% = 0.03）。年月は "YYYY-MM"。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.LDEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  var VERSION = '0.5.0';

  /* ---------- 年月ユーティリティ ---------- */
  function ymIndex(ym) { var p = ym.split('-'); return (+p[0]) * 12 + (+p[1] - 1); }
  function ymFromIndex(i) { var y = Math.floor(i / 12), m = i - y * 12 + 1; return y + '-' + (m < 10 ? '0' : '') + m; }
  function ymAdd(ym, n) { return ymFromIndex(ymIndex(ym) + n); }
  function ymYear(ym) { return +ym.split('-')[0]; }
  function ymMonth(ym) { return +ym.split('-')[1]; }
  /* 時点（月単位）：その月の初め = index、月末 = index + 1 */
  function pointStart(ym) { return ymIndex(ym); }
  function pointEnd(ym) { return ymIndex(ym) + 1; }
  function num(v, d) { return (v === null || v === undefined || v === '' || isNaN(+v)) ? (d === undefined ? 0 : d) : +v; }
  function has(v) { return !(v === null || v === undefined || v === '' || isNaN(+v)); }
  function annual(amount, period) { return period === 'm' ? num(amount) * 12 : num(amount); }
  function round2(x) { return Math.round(x * 100) / 100; }

  /* ---------- 第6章 6.7 外貨建て保険の試算 ---------- */
  /**
   * 米ドル額 U。start = {usd, point}（起点の額と時点）。contractPoint = 契約開始時点。
   * 起点から n か月後の額。契約から240か月（20年）までは年率 i、以降は i2。
   */
  function pgfUsd(startUsd, n, i, i2, m0) {
    m0 = m0 || 0; i2 = num(i2, 0);
    if (n <= 0) return startUsd;
    var p1 = Math.max(0, Math.min(m0 + n, 240) - m0);
    var p2 = n - p1;
    return startUsd * Math.pow(1 + i, p1 / 12) * Math.pow(1 + i2, p2 / 12);
  }
  function pgfFx(fx0, x, n) { return fx0 * Math.pow(1 + num(x, 0), Math.max(0, n) / 12); }

  /** 外貨建て保険の起点（確認済み公式評価額があればそれ、なければ契約時の元本） */
  function pgfStart(policy, asOfYm) {
    var c = policy.contract;
    var cPoint = pointStart(c.startYm);
    var vals = (policy.valuations || []).filter(function (v) {
      return has(v.usd) && (!asOfYm || v.ym <= asOfYm);
    }).sort(function (a, b) { return a.ym < b.ym ? -1 : 1; });
    if (vals.length) {
      var v = vals[vals.length - 1];
      return { usd: +v.usd, point: pointEnd(v.ym), m0: pointEnd(v.ym) - cPoint, official: true };
    }
    return { usd: +c.principalUsd, point: cPoint, m0: 0, official: false };
  }

  /** 外貨建て保険：ある時点（月末）の米ドル額・円換算額。sim = 試算条件 */
  function pgfValueAt(policy, sim, endYm, asOfYm) {
    var s = pgfStart(policy, asOfYm);
    var n = pointEnd(endYm) - s.point;
    if (n < 0) return { usd: null, jpy: null, n: n };
    var usd = pgfUsd(s.usd, n, num(sim.rate), sim.rate2, s.m0);
    var fx = pgfFx(num(sim.fx), sim.fxGrowth, n);
    return { usd: usd, fx: fx, jpy: usd * fx, n: n, official: s.official };
  }

  /** 契約時起点で N 年後の米ドル額（6.7 の表） */
  function pgfTableUsd(principalUsd, rate, years, rate2) {
    return pgfUsd(principalUsd, years * 12, rate, rate2, 0);
  }

  /** 契約条件 → 試算条件の初期値（契約条件に戻す） */
  function pgfSimFromContract(contract) {
    return { rate: contract.rate, rate2: null, fx: contract.fx, fxGrowth: 0 };
  }

  /* ---------- 第3・4章 月次資産 ---------- */
  var FORECAST = { cash: '現金', invest: '運用資産', insurance: '保険', other: '予測対象外', liability: '負債' };

  function itemActive(item, ym) {
    if (item.startYm && ym < item.startYm) return false;
    if (item.endYm && ym > item.endYm) return false;
    return true;
  }

  /** 保険料の払込終了月（払込終了年齢の年の12月） */
  function payEndYm(policy, birthYear) {
    if (!birthYear || !has(policy.contract && policy.contract.payEndAge)) return null;
    return (birthYear + +policy.contract.payEndAge) + '-12';
  }
  /** 毎月の保険料を積立額に加算する保険か（保険A・保険B。Ver.4.2 D-13） */
  function accumulates(policy) { return policy.kind !== 'pgf' && policy.accumulate !== false; }
  function latestValuation(policy, ym) {
    var vals = (policy.valuations || []).filter(function (v) { return v.ym <= ym && (has(v.jpy) || (has(v.usd) && has(v.fxEval))); });
    if (!vals.length) return null;
    vals.sort(function (a, b) { return a.ym < b.ym ? -1 : 1; });
    return vals[vals.length - 1];
  }
  /**
   * 保険の資産額（円）。登録がなければ null（未確認）。
   * PGF：公式の評価額（ドル×評価用為替）。
   * 保険A・保険B：登録した積立額 ＋ 月額保険料 × 登録月の翌月から当月までの月数（払込終了月まで）。
   */
  function insuranceConfirmedJpy(policy, ym, birthYear) {
    var v = latestValuation(policy, ym);
    if (!v) return null;
    var base = has(v.jpy) ? +v.jpy : (+v.usd) * (+v.fxEval);
    if (!accumulates(policy) || !birthYear) return base;
    var end = payEndYm(policy, birthYear);
    var last = end && end < ym ? end : ym;
    var months = Math.max(0, ymIndex(last) - ymIndex(v.ym));
    return base + months * premiumAnnual(policy) / 12;
  }
  /**
   * 総資産に計上する保険の金額（Ver.4.5 D-17）。
   * 公式値・登録した積立額があればその額。外貨建て保険は公式値がない間も、契約条件（契約利率・契約時為替）による
   * 概算額を総資産に計上する（countEstimate=false で従来どおり除外）。将来予測は試算条件で別に計算する。
   */
  function insuranceAssetJpy(policy, ym, birthYear) {
    var c = insuranceConfirmedJpy(policy, ym, birthYear);
    if (c !== null) return { jpy: c, estimate: false };
    if (policy.kind === 'pgf' && policy.countEstimate !== false && policy.contract && ym >= policy.contract.startYm) {
      return { jpy: pgfValueAt(policy, pgfSimFromContract(policy.contract), ym, ym).jpy, estimate: true };
    }
    return { jpy: null, estimate: false };
  }
  /** その月に保険料の積立として加算された額 */
  function insuranceMonthlyAdd(policy, ym, birthYear) {
    if (!accumulates(policy) || !birthYear) return 0;
    var v = latestValuation(policy, ym);
    if (!v || v.ym >= ym) return 0;
    var end = payEndYm(policy, birthYear);
    if (end && ym > end) return 0;
    return premiumAnnual(policy) / 12;
  }

  /**
   * 1か月分の月次レコードを計算（3.2・3.3・3.4）。
   * entries[itemId] = {in, out, bal, note}（未入力は null）
   */
  function computeMonth(state, ym, prevEnd) {
    var month = (state.months && state.months[ym]) || { entries: {}, transfers: [] };
    var entries = month.entries || {};
    var tr = month.transfers || [];
    var rows = [];
    var T = { prev: 0, inn: 0, out: 0, trIn: 0, trOut: 0, val: 0, unc: 0, end: 0, liab: 0, net: 0 };
    var cat = {};
    state.assetItems.forEach(function (item) {
      if (!itemActive(item, ym)) return;
      var prev = prevEnd && has(prevEnd[item.id]) ? prevEnd[item.id] : null;
      var e = entries[item.id] || {};
      var trIn = 0, trOut = 0;
      tr.forEach(function (t) {
        if (t.to === item.id) trIn += num(t.amount);
        if (t.from === item.id) trOut += num(t.amount);
      });
      var r = { id: item.id, name: item.name, category: item.category, forecast: item.forecast, prev: prev,
        inn: 0, out: 0, trIn: trIn, trOut: trOut, val: 0, unc: 0, end: null, mode: 'C', status: '引継ぎ' };
      var b0 = num(prev, 0);
      if (item.forecast === 'insurance') {
        var pol = (state.insurance || []).filter(function (p) { return p.id === item.policyId; })[0];
        var by = state.profile && state.profile.birthYear;
        var av = pol ? insuranceAssetJpy(pol, ym, by) : { jpy: null };
        var conf = av.jpy;
        var add = pol && prev !== null ? insuranceMonthlyAdd(pol, ym, by) : 0;
        r.mode = 'INS'; r.status = conf === null ? '未確認' : av.estimate ? '概算（計上）' : '保険連動'; r.estimate = !!av.estimate;
        r.inn = trIn + add; r.out = trOut; r.premiumAdd = add;
        if (conf === null) { r.end = null; }
        else {
          r.end = conf;
          if (prev === null) { r.unc = conf - (trIn - trOut); } // 新規計上は未区分（4.1）
          else r.val = conf - b0 - r.inn + trOut;
        }
      } else {
        var inn = num(e.in) + trIn, out = num(e.out) + trOut;
        var hasIO = has(e.in) || has(e.out) || trIn > 0 || trOut > 0;
        r.inn = inn; r.out = out;
        if (has(e.bal) && hasIO) { r.mode = 'A'; r.end = +e.bal; r.val = r.end - b0 - inn + out; r.status = '入力済み'; }
        else if (has(e.bal)) { r.mode = 'B'; r.end = +e.bal; r.unc = r.end - b0; r.status = '入力済み'; }
        else if (hasIO) { r.mode = 'D'; r.end = b0 + inn - out; r.status = '入力済み'; }
        else { r.mode = 'C'; r.end = prev === null ? null : b0; r.status = prev === null ? '未入力' : '引継ぎ'; }
        if (e.noChange) { r.status = '変更なし'; }
      }
      rows.push(r);
      if (r.end === null) return;
      if (item.forecast === 'liability') { T.liab += r.end; return; }
      T.prev += b0; T.inn += r.inn; T.out += r.out;
      T.val += r.val; T.unc += r.unc; T.end += r.end;
      cat[item.category] = (cat[item.category] || 0) + r.end;
    });
    // 振替は両側が総資産に含まれる場合だけ相殺（未確認の保険・負債への振替は純入出金として扱う）
    var incl = {};
    rows.forEach(function (r) { if (r.end !== null && r.forecast !== 'liability') incl[r.id] = true; });
    tr.forEach(function (t) { if (incl[t.from] && incl[t.to]) { T.trIn += num(t.amount); T.trOut += num(t.amount); } });
    T.net = T.end - T.liab;
    T.netInflow = (T.inn - T.trIn) - (T.out - T.trOut);
    T.check = Math.abs((T.prev + T.inn - T.out + T.val + T.unc) - T.end) < 0.5;
    return { ym: ym, closed: !!month.closed, rows: rows, totals: T, byCategory: cat };
  }

  /** 全月の系列を計算（前月残高の引継ぎ） */
  function computeHistory(state) {
    var yms = Object.keys(state.months || {}).sort();
    if (!yms.length) return [];
    var out = [], prevEnd = null;
    for (var i = ymIndex(yms[0]); i <= ymIndex(yms[yms.length - 1]); i++) {
      var ym = ymFromIndex(i);
      var m = computeMonth(state, ym, prevEnd);
      prevEnd = {};
      m.rows.forEach(function (r) { if (r.end !== null) prevEnd[r.id] = r.end; });
      out.push(m);
    }
    return out;
  }

  /** 4.1 集計値：総資産・前月比・年始比・前年同月比 */
  function summarize(history, ym) {
    var byYm = {}; history.forEach(function (h) { byYm[h.ym] = h; });
    var cur = byYm[ym];
    if (!cur) return null;
    function cmp(baseYm) {
      var b = byYm[baseYm];
      if (!b || !b.totals.end) return null;
      var d = cur.totals.end - b.totals.end;
      return { base: b.totals.end, diff: d, rate: d / b.totals.end, baseYm: baseYm };
    }
    var ytdBase = (ymYear(ym) - 1) + '-12';
    var ytd = cmp(ytdBase);
    var ytdNote = null;
    if (!ytd && history.length) { ytd = cmp(history[0].ym); ytdNote = '開始月を比較元'; }
    // 年初来の要因（1月〜当月の合計）
    var f = { netInflow: 0, val: 0, unc: 0 };
    history.forEach(function (h) {
      if (h.ym > ytdBase && h.ym <= ym && (byYm[ytdBase] || h.ym > history[0].ym)) {
        f.netInflow += h.totals.netInflow; f.val += h.totals.val; f.unc += h.totals.unc;
      }
    });
    return {
      ym: ym, total: cur.totals.end, liab: cur.totals.liab, net: cur.totals.net,
      mom: cmp(ymAdd(ym, -1)), ytd: ytd, ytdNote: ytdNote, yoy: cmp(ymAdd(ym, -12)),
      factors: { netInflow: cur.totals.netInflow, val: cur.totals.val, unc: cur.totals.unc },
      factorsYtd: f, byCategory: cur.byCategory, check: cur.totals.check
    };
  }

  function latestClosedYm(state) {
    var yms = Object.keys(state.months || {}).filter(function (k) { return state.months[k].closed; }).sort();
    return yms.length ? yms[yms.length - 1] : null;
  }

  /* ---------- 第5章 MY LIFE ---------- */
  /**
   * 5.5 年金（Ver.4.3 D-14）
   * base65Monthly（65歳開始の見込月額）があり手入力でなければ、受給開始年齢で自動計算：
   *   繰上げ（60〜64歳）1か月あたり0.4%減、繰下げ（66〜75歳）1か月あたり0.7%増。
   * それ以外は amount／period をそのまま使う。
   */
  function pensionFactor(startAge) {
    var a = Math.max(60, Math.min(75, num(startAge, 65)));
    if (a < 65) return 1 - 0.004 * (65 - a) * 12;
    if (a > 65) return 1 + 0.007 * (a - 65) * 12;
    return 1;
  }
  function pensionAnnual(p) {
    if (has(p.base65Monthly) && p.amountMode !== 'manual') return +p.base65Monthly * pensionFactor(p.startAge) * 12;
    return annual(p.amount, p.period);
  }
  function pensionInvesting(p, age) { return !!(p.invest && p.invest.enabled && age <= num(p.invest.untilAge, 0)); }
  function ageAt(profile, year) { return year - profile.birthYear; } // 各年12月31日時点の満年齢

  function premiumAnnual(policy) {
    return (policy.contract.premiums || []).reduce(function (s, p) { return s + num(p.monthly) * 12; }, 0);
  }

  /** 5.6 収支サマリー（現在の年、手取り・現在価値） */
  /**
   * 転職と完全退職（Ver.4.5 D-16）
   *  retireAge     ＝ 転職年齢（今の仕事を退職。以後の給与系収入は今の手取り ×（1＋jobChangeRate））
   *  fullRetireAge ＝ 完全退職（隠居）年齢。給与系収入0、積立終了、退職後の支出変化率の開始
   *  fullRetireAge が未設定なら retireAge と同じ（＝転職せずに退職）。
   */
  function fullRetireOf(A) {
    var r = num(A.retireAge, 65);
    return has(A.fullRetireAge) ? Math.max(+A.fullRetireAge, r) : r;
  }
  function lifeSummary(state, year) {
    var age = ageAt(state.profile, year);
    var R = num(state.assumptions.retireAge, 65);
    var FR = fullRetireOf(state.assumptions);
    var JC = num(state.assumptions.jobChangeRate, 0);
    var inc = 0, pen = 0, fixed = 0, variable = 0, special = 0, prem = 0, specialAvg = 0;
    (state.plan.incomes || []).forEach(function (x) {
      if (x.type === 'oneoff') return;
      if (!inRange(x, age)) return;
      if (x.type === 'salary' && age >= FR) return;
      inc += annual(x.amount, x.period) * (x.type === 'salary' && age >= R ? 1 + JC : 1);
    });
    var penInv = 0;
    (state.plan.pensions || []).forEach(function (p) { if (age >= num(p.startAge, 65) && (!has(p.endAge) || age <= p.endAge)) { if (pensionInvesting(p, age)) penInv += pensionAnnual(p); else pen += pensionAnnual(p); } });
    (state.plan.expenses || []).forEach(function (e) {
      if (e.group === 'special') {
        special += specialAmountAt(e, age);
        for (var k = 0; k < 10; k++) specialAvg += specialAmountAt(e, age + k) / 10;
        return;
      }
      if (!inRange(e, age)) return;
      var a = annual(e.amount, e.period) * expenseRuleFactor(state.plan.expenseRules, state.plan.expenses, e, age, FR) * (age >= FR && !hasRetireOverride(state.plan.expenseRules, e) ? num(e.retireFactor, 1) : 1);
      if (e.group === 'fixed') fixed += a; else variable += a;
    });
    (state.insurance || []).forEach(function (p) { if (age <= num(p.contract.payEndAge, 999)) prem += premiumAnnual(p); });
    var expense = fixed + variable + special + prem;
    var balance = inc + pen - expense;
    var sv = state.plan.savings || {};
    var saving = (age < Math.min(has(sv.endAge) ? +sv.endAge + 1 : FR, FR)) ? annual(sv.monthly, 'm') + num(sv.bonusAnnual) : 0;
    var expenseAvg = fixed + variable + specialAvg + prem;
    return {
      year: year, age: age, income: inc, pension: pen, pensionInvested: penInv, fixed: fixed, variable: variable, special: special,
      specialAvg: specialAvg, premium: prem, expense: expense, balance: balance,
      savingRate: inc > 0 ? balance / inc : null,
      balanceAvg: inc + pen - expenseAvg, savingRateAvg: inc > 0 ? (inc + pen - expenseAvg) / inc : null,
      saving: saving, afterSaving: balance - saving, monthlyBalance: balance / 12
    };
  }
  function inRange(x, age) {
    if (has(x.startAge) && age < +x.startAge) return false;
    if (has(x.endAge) && age > +x.endAge) return false;
    return true;
  }
  function specialAmountAt(e, age) {
    var a0 = num(e.atAge, NaN);
    if (isNaN(a0) || age < a0) return 0;
    var N = num(e.everyN, 0);
    var last = has(e.lastAge) ? +e.lastAge : (N > 0 ? 999 : a0);
    if (age > last) return 0;
    if (N > 0 ? ((age - a0) % N === 0) : age === a0) return num(e.amount);
    return 0;
  }

  /* ---------- 第7章 MY FUTURE ---------- */
  var SCENARIOS_DEFAULT = {
    std: { label: '標準', r: 0.03, i: 0.02, rc: 0.002 },
    low: { label: '慎重', r: 0.015, i: 0.025, rc: 0.001 },
    high: { label: '楽観', r: 0.05, i: 0.015, rc: 0.003 }
  };

  /**
   * 状態から予測入力を作る（7.2）。baseYm = 起点の確定月。
   * scenarioKey を渡すと r・i・rc をそのシナリオ値にし、項目別利回りは標準との差だけずらす。
   */
  function buildInput(state, opts) {
    opts = opts || {};
    var baseYm = opts.baseYm || latestClosedYm(state);
    var hist = computeHistory(state);
    var m = hist.filter(function (h) { return h.ym === baseYm; })[0];
    var A = state.assumptions;
    var sc = (A.scenarios || SCENARIOS_DEFAULT);
    var key = opts.scenario || A.scenario || 'std';
    var s = sc[key] || sc.std;
    var stdR = sc.std.r;
    var cash = 0, other = 0, invest = [];
    (m ? m.rows : []).forEach(function (r) {
      if (r.end === null) return;
      var item = state.assetItems.filter(function (x) { return x.id === r.id; })[0];
      if (item.forecast === 'cash') cash += r.end;
      else if (item.forecast === 'other') other += r.end;
      else if (item.forecast === 'invest') {
        var rj = has(item.rate) ? (+item.rate + (s.r - stdR)) : s.r;
        invest.push({ id: item.id, name: item.name, bal: r.end, rate: rj, withdrawAge: has(item.withdrawAge) ? +item.withdrawAge : null });
      }
    });
    var policies = (state.insurance || []).map(function (p) {
      return {
        id: p.id, name: p.name, kind: p.kind, premiumAnnual: premiumAnnual(p), payEndAge: num(p.contract.payEndAge, 999),
        confirmedJpy: baseYm ? insuranceConfirmedJpy(p, baseYm, state.profile.birthYear) : null,
        accumulates: accumulates(p),
        pgf: p.kind === 'pgf' ? { policy: p, sim: p.sim || pgfSimFromContract(p.contract) } : null
      };
    });
    return {
      baseYm: baseYm, birthYear: state.profile.birthYear,
      cash: cash, other: other, invest: invest, policies: policies,
      r: s.r, i: s.i, rc: s.rc, scenario: key, rateDelta: s.r - stdR,
      pensionGrowth: has(A.pensionGrowth) ? +A.pensionGrowth : null,
      retireAge: num(A.retireAge, 65), endAge: num(A.endAge, 100), tau: num(A.tau, 0),
      defenseMonths: num(A.defenseMonths, 0),
      fullRetireAge: fullRetireOf(A), jobChangeRate: num(A.jobChangeRate, 0),
      incomes: clone(state.plan.incomes || []), incomeRules: clone(state.plan.incomeRules || []),
      pensions: clone(state.plan.pensions || []), expenses: clone(state.plan.expenses || []),
      expenseRules: clone(state.plan.expenseRules || []), savings: clone(state.plan.savings || {})
    };
  }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  /** 7.4 収入：収入ルール（年齢の昇順、後のルールが上書き） */
  function incomeAt(inp, x, age, el) {
    if (x.type === 'oneoff') return 0;
    if (!inRange(x, age)) return 0;
    var FR = has(inp.fullRetireAge) ? Math.max(+inp.fullRetireAge, inp.retireAge) : inp.retireAge;
    if (x.type === 'salary' && age >= FR) return 0;
    var base = annual(x.amount, x.period) * Math.pow(1 + num(x.growth, 0), el);
    var rules = (inp.incomeRules || []).map(function (r, idx) { return { r: r, idx: idx }; }).filter(function (o) {
      var r = o.r;
      return (r.target === x.id || (r.target === 'salary' && x.type === 'salary') || r.target === 'all') && age >= +r.age;
    }).sort(function (a, b) { return (+a.r.age - +b.r.age) || (a.idx - b.idx); });
    // 転職後は今の手取りから増減（収入ルールがあれば、そちらで上書き）
    var y = (x.type === 'salary' && age >= inp.retireAge) ? base * (1 + num(inp.jobChangeRate, 0)) : base;
    rules.forEach(function (o) {
      var r = o.r;
      if (r.method === 'amount' && (r.target === 'salary' || r.target === 'all')) {
        // 区分が対象の金額指定は、区分の合計をその額にする（項目の比率は今のまま。Ver.4.6 D-19）
        var grp = (inp.incomes || []).filter(function (z) { return z.type !== 'oneoff' && inRange(z, age) && (r.target === 'all' || z.type === 'salary'); });
        var tot = grp.reduce(function (s2, z) { return s2 + annual(z.amount, z.period); }, 0);
        y = num(r.value) * (tot > 0 ? annual(x.amount, x.period) / tot : 1 / Math.max(1, grp.length));
      }
      else if (r.method === 'amount') y = num(r.value);
      else if (r.method === 'ratio') y = base * (1 + num(r.value));
      else if (r.method === 'stop') y = 0;
    });
    return y;
  }

  /**
   * 支出ルール（Ver.4.4 D-15）：固定生活費・変動生活費を年齢別に変える。収入ルールと同じ考え方。
   *  対象：区分すべて（'fixed'／'variable'）または個別の支出項目ID
   *  方式：ratio（現在の額から±%）／amount（変更後の年額。区分が対象なら区分合計をその額にする）／stop（0）
   *  年齢の昇順に適用し、後のルールが前のルールを上書きする（同じ年齢なら区分→個別の順）。
   *  戻り値：その支出項目に掛ける倍率（今日の物価ベース。インフレ・退職後の変化率は別に掛ける）
   */
  /** ルールの開始年齢。atFullRetire のルール（完全退職後の金額、D-18）は完全退職年齢に合わせる */
  function ruleAge(r, fra) { return r.atFullRetire ? num(fra, 999) : +r.age; }
  /** 完全退職後の金額が設定されている支出か（その場合は退職後の変化率を掛けない） */
  function hasRetireOverride(rules, e) { return (rules || []).some(function (r) { return r.atFullRetire && (r.target === e.group || r.target === e.id); }); }
  /** その年齢の給与系収入の合計（今日の物価・増減率なし。期間別の収入の初期値づくり用） */
  function salaryAt(inp, age) {
    return (inp.incomes || []).filter(function (x) { return x.type === 'salary'; }).reduce(function (s2, x) { return s2 + incomeAt(inp, x, age, 0); }, 0);
  }
  function expenseRuleFactor(rules, expenses, e, age, fra) {
    var base = annual(e.amount, e.period);
    var f = 1;
    (rules || []).map(function (r, i) { return { r: r, i: i }; }).filter(function (o) {
      return (o.r.target === e.group || o.r.target === e.id) && age >= ruleAge(o.r, fra);
    }).sort(function (a, b) {
      return (ruleAge(a.r, fra) - ruleAge(b.r, fra)) || ((a.r.target === e.id) - (b.r.target === e.id)) || (a.i - b.i);
    }).forEach(function (o) {
      var r = o.r;
      if (r.method === 'ratio') f = 1 + num(r.value);
      else if (r.method === 'stop') f = 0;
      else if (r.method === 'amount') {
        if (r.target === e.id) f = base > 0 ? num(r.value) / base : 0;
        else {
          var gsum = (expenses || []).filter(function (x) { return x.group === e.group && inRange(x, age); })
            .reduce(function (s2, x) { return s2 + annual(x.amount, x.period); }, 0);
          f = gsum > 0 ? num(r.value) / gsum : 0;
        }
      }
    });
    return f;
  }

  /**
   * 7.5 年間の計算手順（手順1〜7）
   * 戻り値 { rows: [...], depletionAge, milestones, input }
   */
  function project(inp) {
    var rows = [];
    var baseYm = inp.baseYm;
    var by = ymYear(baseYm), bm = ymMonth(baseYm);
    var C = inp.cash, X = inp.other;
    var A = inp.invest.map(function (a) { return { id: a.id, name: a.name, bal: a.bal, rate: a.rate, withdrawAge: a.withdrawAge }; });
    // 年金を投資に回す場合の運用口（D-14）：投資期間中は取り崩さず、積立の配分先にもしない
    var pots = {};
    inp.pensions.forEach(function (p, pi) {
      if (!(p.invest && p.invest.enabled)) return;
      var pot = { id: 'pension-pot-' + (p.id || pi), name: '年金の運用', bal: 0, rate: num(p.invest.rate, inp.r) + num(inp.rateDelta, 0), withdrawAge: num(p.invest.untilAge, 0) + 1, noSave: true };
      pots[pi] = pot; A.push(pot);
    });
    var piP = inp.pensionGrowth !== null && inp.pensionGrowth !== undefined ? inp.pensionGrowth : inp.i - 0.005;
    var year = by, f = 12 - bm, elStart = 0;
    if (f === 0) { year = by + 1; f = 12; }
    var depletionAge = null;
    var startAge = year - inp.birthYear;
    var insAcc = inp.policies.map(function (p) { return p.confirmedJpy || 0; });
    var sv = inp.savings || {};
    var saveAnnual = annual(sv.monthly, 'm') + num(sv.bonusAnnual);
    var FRA = has(inp.fullRetireAge) ? Math.max(+inp.fullRetireAge, inp.retireAge) : inp.retireAge;
    var saveEnd = has(sv.endAge) ? Math.min(+sv.endAge, FRA - 1) : FRA - 1;
    while (true) {
      var age = year - inp.birthYear;
      if (age > inp.endAge) break;
      var k = f / 12, el = elStart, elEnd = elStart + k;
      // 手順1 年間収支
      var Y = 0, P = 0, O = 0;
      inp.incomes.forEach(function (x) {
        if (x.type === 'oneoff') { if (+x.atAge === age) O += num(x.amount); }
        else Y += incomeAt(inp, x, age, el) * k;
      });
      var PI = 0, potAdd = {};
      inp.pensions.forEach(function (p, pi) {
        if (age >= num(p.startAge, 65) && (!has(p.endAge) || age <= +p.endAge)) {
          var amt = pensionAnnual(p) * Math.pow(1 + piP, el) * k;
          if (pensionInvesting(p, age) && pots[pi]) { potAdd[pi] = amt; PI += amt; } else P += amt;
        }
      });
      var fixed = 0, variable = 0, special = 0;
      inp.expenses.forEach(function (e) {
        var infl = e.inflate === false ? 1 : Math.pow(1 + inp.i, el);
        if (e.group === 'special') { special += specialAmountAt(e, age) * infl; return; }
        if (!inRange(e, age)) return;
        var rf = expenseRuleFactor(inp.expenseRules, inp.expenses, e, age, FRA);
        var mu = age >= FRA && !hasRetireOverride(inp.expenseRules, e) ? num(e.retireFactor, 1) : 1;
        var a = annual(e.amount, e.period) * rf * infl * mu;
        if (e.group === 'fixed') fixed += a * k; else variable += a * k;
      });
      var H = 0;
      inp.policies.forEach(function (p) { if (age <= p.payEndAge) H += p.premiumAnnual * k; });
      var E = fixed + variable + special + H;
      var CF = Y + P + O - E;
      // 生活防衛資金 D（生活費＋ゆとり費の N か月分、年額ベース）
      var D = inp.defenseMonths / 12 * (k > 0 ? (fixed + variable) / k : 0);
      // 手順2 積立額
      var S = (age <= saveEnd) ? saveAnnual * k : 0;
      var Sp = Math.max(0, Math.min(S, C + CF - D));
      // 手順3 現金と運用資産の更新（期中発生は半期分の運用）
      var rcEff = C > 0 ? inp.rc : 0;
      C = C * Math.pow(1 + rcEff, k) + (CF - Sp) * (1 + inp.rc * k / 2);
      var totA = A.reduce(function (s, a) { return s + (a.noSave ? 0 : Math.max(0, a.bal)); }, 0);
      var firstSave = A.filter(function (a) { return !a.noSave; })[0];
      A.forEach(function (a) {
        var share = a.noSave ? 0 : totA > 0 ? Math.max(0, a.bal) / totA : (a === firstSave ? 1 : 0);
        if (sv.targetId && !a.noSave) share = a.id === sv.targetId ? 1 : 0;
        a.bal = a.bal * Math.pow(1 + a.rate, k) + Sp * share * (1 + a.rate * k / 2);
      });
      Object.keys(potAdd).forEach(function (pi) { var pot = pots[pi]; pot.bal += potAdd[pi] * (1 + pot.rate * k / 2); });
      if (sv.targetId && !A.some(function (a) { return a.id === sv.targetId; }) && A.length) {
        A[0].bal += Sp * (1 + A[0].rate * k / 2);
      }
      // 手順4 取崩し（年末）
      var W = 0;
      if (C < D) {
        var avail = A.filter(function (a) { return a.withdrawAge === null || age >= a.withdrawAge; });
        var availSum = avail.reduce(function (s, a) { return s + Math.max(0, a.bal); }, 0);
        var need = (D - C) / (1 - inp.tau);
        W = Math.min(need, availSum);
        if (W > 0) avail.forEach(function (a) { a.bal -= W * Math.max(0, a.bal) / availSum; });
        C += W * (1 - inp.tau);
      }
      // 手順5 保険の評価額
      var endYm = year + '-12';
      var I = 0, pgfJpy = 0, pgfUsdV = null;
      inp.policies.forEach(function (p, pi) {
        if (p.pgf) {
          var v = pgfValueAt(p.pgf.policy, p.pgf.sim, endYm, baseYm);
          if (v.jpy !== null) { pgfJpy = v.jpy; pgfUsdV = v.usd; I += v.jpy; }
        } else if (p.confirmedJpy !== null) {
          // 保険A・保険B：払込終了年齢まで保険料を積立額に加算（D-13）
          if (p.accumulates && age <= p.payEndAge) insAcc[pi] += p.premiumAnnual * k;
          I += insAcc[pi];
        }
      });
      var Atot = A.reduce(function (s, a) { return s + a.bal; }, 0);
      var withdrawable = A.filter(function (a) { return a.withdrawAge === null || age >= a.withdrawAge; }).reduce(function (s, a) { return s + a.bal; }, 0);
      // 手順6 資産不足の判定
      var shortfall = C < 0 ? -C : 0;
      if (depletionAge === null && C + withdrawable < 0) depletionAge = age;
      // 手順7 集計
      var total = C + Atot + I + X;
      var defl = Math.pow(1 + inp.i, elEnd);
      rows.push({
        year: year, age: age, months: f, income: Y, pension: P, pensionInvested: PI,
        pensionPot: Object.keys(pots).reduce(function (s, pi) { return s + pots[pi].bal; }, 0), oneoff: O, fixed: fixed, variable: variable,
        special: special, premium: H, expense: E, cf: CF, defense: D, save: Sp, withdraw: W,
        cash: C, invest: Atot, insurance: I, pgfJpy: pgfJpy, pgfUsd: pgfUsdV, other: X,
        financial: C + Atot, total: total, real: total / defl, deflator: defl, shortfall: shortfall
      });
      elStart = elEnd; year++; f = 12;
    }
    var ms = {};
    [60, 65, 70, 80, 90, 100].forEach(function (a) {
      var r = rows.filter(function (x) { return x.age === a; })[0];
      ms[a] = r ? { total: r.total, real: r.real, insurance: r.insurance, realIns: r.insurance / r.deflator, financial: r.financial } : null;
    });
    var retireRow = rows.filter(function (x) { return x.age === FRA - 1; })[0] || rows.filter(function (x) { return x.age === FRA; })[0];

    return { rows: rows, depletionAge: depletionAge, milestones: ms, startAge: startAge,
      retireAssets: retireRow ? retireRow.total : null, withdrawStartAge: firstW ? firstW.age : null,
      engineVersion: VERSION };
  }

  /** 3シナリオ（標準・慎重・楽観）を一括計算 */
  function projectScenarios(state, overrideFn) {
    var out = {};
    ['std', 'low', 'high'].forEach(function (k) {
      var inp = buildInput(state, { scenario: k });
      if (overrideFn) inp = overrideFn(inp);
      out[k] = project(inp);
    });
    return out;
  }

  /** 7.9 契約条件どおりのPGF試算に置き換えた入力 */
  function withContractPgf(inp) {
    var c = clone(inp);
    c.policies = inp.policies.map(function (p) {
      if (!p.pgf) return p;
      return Object.assign({}, p, { pgf: { policy: p.pgf.policy, sim: pgfSimFromContract(p.pgf.policy.contract) } });
    });
    return c;
  }
  function pgfSimDiffers(policy) {
    var s = policy.sim || {}, c = policy.contract;
    return Math.abs(num(s.rate) - c.rate) > 1e-9 || Math.abs(num(s.fx) - c.fx) > 1e-9 || num(s.fxGrowth) !== 0 || has(s.rate2);
  }

  /* ---------- 第8章 WHAT IF ---------- */
  /**
   * changes の各要素: {type, ...}
   *  retire {age} / income {target, age, method, value} / incomeGrowth {value}
   *  expense {target:'fixed'|'variable', age, method, value} / travel {amount, startAge, endAge}
   *  special {name, amount, atAge, everyN, lastAge} / saving {monthly, endAge}
   *  rate {value} / inflation {value} / pension {startAge, amount} / oneoff {amount, atAge}
   *  pgfRate {value} / pgfRate2 {value} / pgfFx {value} / pgfFxGrowth {value}
   */
  function applyChanges(inp, changes) {
    var c = clone(inp);
    // policy オブジェクトは参照を保持（契約条件は変更しない）
    c.policies = inp.policies.map(function (p) {
      var q = Object.assign({}, p);
      if (p.pgf) q.pgf = { policy: p.pgf.policy, sim: Object.assign({}, p.pgf.sim) };
      return q;
    });
    var pg = c.policies.filter(function (p) { return p.pgf; })[0];
    (changes || []).forEach(function (ch) {
      if (ch.enabled === false) return;
      switch (ch.type) {
        case 'retire': c.retireAge = +ch.age; if (has(c.fullRetireAge) && c.fullRetireAge < c.retireAge) c.fullRetireAge = c.retireAge; break;
        case 'fullRetire': c.fullRetireAge = +ch.age; if (c.retireAge > c.fullRetireAge) c.retireAge = c.fullRetireAge; break;
        case 'jobChange': c.jobChangeRate = num(ch.value); break;
        case 'income': c.incomeRules.push({ target: ch.target || 'salary', age: +ch.age, method: ch.method, value: num(ch.value) }); break;
        case 'incomeGrowth': c.incomes.forEach(function (x) { if (x.type !== 'oneoff') x.growth = num(ch.value); }); break;
        case 'expense': c.expenseRules.push({ target: ch.target, age: +ch.age, method: ch.method, value: num(ch.value) }); break;
        case 'travel': c.expenses.push({ id: 'wi-travel', name: '旅行', group: 'variable', amount: num(ch.amount), period: 'y', startAge: ch.startAge, endAge: ch.endAge, inflate: true }); break;
        case 'special': c.expenses.push({ id: 'wi-sp-' + Math.random(), name: ch.name || '特別支出', group: 'special', amount: num(ch.amount), atAge: +ch.atAge, everyN: num(ch.everyN, 0), lastAge: has(ch.lastAge) ? +ch.lastAge : null, inflate: true }); break;
        case 'saving': c.savings = Object.assign({}, c.savings, { monthly: num(ch.monthly), bonusAnnual: has(ch.bonusAnnual) ? +ch.bonusAnnual : c.savings.bonusAnnual }); if (has(ch.endAge)) c.savings.endAge = +ch.endAge; break;
        case 'rate': var d = num(ch.value) - c.r; c.r = num(ch.value); c.invest.forEach(function (a) { a.rate += d; }); c.rateDelta = num(c.rateDelta, 0) + d; break;
        case 'inflation': c.i = num(ch.value); break;
        case 'pension': c.pensions = c.pensions.map(function (p, idx) { if (idx === 0) { p = clone(p); if (has(ch.startAge)) p.startAge = +ch.startAge; if (has(ch.amount)) { p.amount = +ch.amount; p.period = 'y'; p.amountMode = 'manual'; } if (ch.investEnabled !== undefined && ch.investEnabled !== null) { p.invest = Object.assign({}, p.invest || {}, { enabled: !!ch.investEnabled }); } if (has(ch.investUntil)) p.invest = Object.assign({}, p.invest || { enabled: true }, { untilAge: +ch.investUntil }); if (has(ch.investRate)) p.invest = Object.assign({}, p.invest || { enabled: true }, { rate: +ch.investRate }); } return p; }); break;
        case 'oneoff': c.incomes.push({ id: 'wi-oo', name: ch.name || '一時収入', type: 'oneoff', amount: num(ch.amount), atAge: +ch.atAge }); break;
        case 'pgfRate': if (pg) pg.pgf.sim.rate = num(ch.value); break;
        case 'pgfRate2': if (pg) pg.pgf.sim.rate2 = has(ch.value) ? +ch.value : null; break;
        case 'pgfFx': if (pg) pg.pgf.sim.fx = num(ch.value); break;
        case 'pgfFxGrowth': if (pg) pg.pgf.sim.fxGrowth = num(ch.value); break;
      }
    });
    return c;
  }

  function validateChanges(inp, changes) {
    var errs = [];
    var curAge = ymYear(inp.baseYm) - inp.birthYear;
    (changes || []).forEach(function (ch) {
      if (ch.enabled === false) return;
      if (ch.type === 'retire' && (+ch.age < curAge || +ch.age < 50 || +ch.age > 80)) errs.push('転職年齢は現在年齢以上・50〜80歳で指定してください');
      if (ch.type === 'fullRetire' && (+ch.age < curAge || +ch.age < 50 || +ch.age > 85)) errs.push('完全退職年齢は現在年齢以上・50〜85歳で指定してください');
      if (ch.type === 'pension' && has(ch.startAge) && (+ch.startAge < 60 || +ch.startAge > 75)) errs.push('年金開始年齢は60〜75歳で指定してください');
      if (ch.type === 'pgfRate' && (num(ch.value) < -0.05 || num(ch.value) > 0.15)) errs.push('PGF試算年率は−5%〜15%で指定してください');
      if (ch.type === 'pgfFx' && num(ch.value) <= 0) errs.push('為替は0円より大きい値を指定してください');
    });
    return errs;
  }

  /** 現状維持と変更後を同じエンジンで計算し、差と内訳（その変更だけ戻した差）を返す */
  function runWhatIf(baseInput, changes) {
    var base = project(baseInput);
    var after = project(applyChanges(baseInput, changes));
    var active = (changes || []).filter(function (c) { return c.enabled !== false; });
    var breakdown = active.map(function (ch, idx) {
      var without = project(applyChanges(baseInput, active.filter(function (_, j) { return j !== idx; })));
      var d = {};
      after.rows.forEach(function (r, i) { d[r.age] = r.total - without.rows[i].total; });
      return { change: ch, diffByAge: d };
    });
    var diff = after.rows.map(function (r, i) { return { age: r.age, year: r.year, total: r.total - base.rows[i].total, real: r.real - base.rows[i].real }; });
    return { base: base, after: after, diff: diff, breakdown: breakdown };
  }

  /** 9.3 find_required_value：100歳まで資産が尽きない最小の退職年齢 */
  /** 「100歳まで資産が尽きない」を満たす最も早い完全退職年齢 */
  function findMinRetireAge(baseInput, lo, hi) {
    lo = lo || 50; hi = hi || 80;
    var curAge = ymYear(baseInput.baseYm) - baseInput.birthYear;
    for (var a = Math.max(lo, curAge); a <= hi; a++) {
      var r = project(applyChanges(baseInput, [{ type: 'fullRetire', age: a }]));
      if (r.depletionAge === null) return a;
    }
    return null;
  }

  /** 生活費（固定）の変化率の上限：100歳まで尽きない最大の追加支出（年額）を二分探索 */
  function findMaxExtraSpending(baseInput) {
    var curAge = ymYear(baseInput.baseYm) - baseInput.birthYear;
    function ok(x) { return project(applyChanges(baseInput, [{ type: 'travel', amount: x, startAge: curAge, endAge: baseInput.endAge }])).depletionAge === null; }
    if (!ok(0)) return 0;
    var lo = 0, hi = 50000000;
    if (ok(hi)) return hi;
    for (var n = 0; n < 40; n++) { var mid = (lo + hi) / 2; if (ok(mid)) lo = mid; else hi = mid; }
    return Math.floor(lo / 10000) * 10000;
  }

  return {
    VERSION: VERSION, FORECAST: FORECAST, SCENARIOS_DEFAULT: SCENARIOS_DEFAULT,
    ymIndex: ymIndex, ymFromIndex: ymFromIndex, ymAdd: ymAdd, ymYear: ymYear, ymMonth: ymMonth,
    pgfUsd: pgfUsd, pgfFx: pgfFx, pgfValueAt: pgfValueAt, pgfTableUsd: pgfTableUsd, pgfSimFromContract: pgfSimFromContract,
    pgfStart: pgfStart, pgfSimDiffers: pgfSimDiffers,
    computeMonth: computeMonth, computeHistory: computeHistory, summarize: summarize, latestClosedYm: latestClosedYm,
    insuranceConfirmedJpy: insuranceConfirmedJpy, insuranceAssetJpy: insuranceAssetJpy, insuranceMonthlyAdd: insuranceMonthlyAdd, payEndYm: payEndYm, accumulates: accumulates, premiumAnnual: premiumAnnual, ageAt: ageAt,
    lifeSummary: lifeSummary, salaryAt: salaryAt, fullRetireOf: fullRetireOf, expenseRuleFactor: expenseRuleFactor, pensionFactor: pensionFactor, pensionAnnual: pensionAnnual, specialAmountAt: specialAmountAt,
    buildInput: buildInput, project: project, projectScenarios: projectScenarios, withContractPgf: withContractPgf,
    applyChanges: applyChanges, validateChanges: validateChanges, runWhatIf: runWhatIf,
    findMinRetireAge: findMinRetireAge, findMaxExtraSpending: findMaxExtraSpending, round2: round2, clone: clone
  };
});

function setStatus(text, warn){ var el=document.getElementById('saveStatus'); el.textContent=text; el.className='chip-status'+(warn?' warn':''); }
function lsGet(){ try{ var s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function lsSet(v){ try{ localStorage.setItem(LS_KEY, JSON.stringify(v)); return true; }catch(e){ return false; } }

function initStore(){
  if(PWA_BUILD){ store.mode='local'; store.error=null; var v0=lsGet(); S=v0?migrate(v0):null; setStatus('この端末に保存'); render(); return; }
  var finished=false;
  var t=setTimeout(function(){ if(!finished){ finished=true; fallback('クラウド保存に接続できません'); } }, 10000);
  var cl = window.claude && window.claude.use ? window.claude.use : null;
  if(!cl){ clearTimeout(t); finished=true; fallback('この画面ではクラウド保存が使えません'); return; }
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(res){
    var db=res[0], user=res[1];
    if(!db||!user){ clearTimeout(t); finished=true; fallback('サインインしていないためクラウド保存が使えません'); return; }
    return user.id().then(function(uid){
      if(!uid){ clearTimeout(t); finished=true; fallback('利用者IDを取得できません'); return; }
      store.ref = db.collection('data/users/'+uid).doc(DOC_PATH);
      store.ref.onSnapshot(function(snap){
        if(snap.metadata && snap.metadata.hasPendingWrites) return;
        var first = !finished;
        if(snap.metadata && snap.metadata.fromCache && first){ // 前回のコピー：表示はするが確定を待つ
          if(snap.exists && !S){ S=migrate(JSON.parse(JSON.stringify(snap.data()))); render(); }
          return;
        }
        if(first){ clearTimeout(t); finished=true; store.mode='cloud'; setStatus('クラウド保存（同期済み）'); }
        if(!snap.exists){ if(!S){ S=null; render(); } return; }
        var d=snap.data();
        var incoming = JSON.stringify(d);
        if(incoming===store.lastWritten) return;
        if(store.writing||store.timer){ return; } // 自分の未保存の変更を優先
        var curRev = S && S.meta ? S.meta.rev||0 : -1;
        if(!S || (d.meta && (d.meta.rev||0) >= curRev)){
          S=migrate(JSON.parse(incoming));
          if(!first) toast('別の端末での変更を反映しました');
          render();
        }
      }, function(err){
        clearTimeout(t);
        if(!finished){ finished=true; fallback('クラウド保存エラー（'+(err&&err.code||'unavailable')+'）'); }
        else { store.mode='error'; setStatus('同期が停止しました（'+(err&&err.code||'')+'）', true); }
      });
    });
  }).catch(function(e){ clearTimeout(t); if(!finished){ finished=true; fallback('クラウド保存に接続できません'); } });
}
function fallback(msg){
  store.mode='local'; store.error=msg;
  var v=lsGet();
  S = v ? migrate(v) : null;
  setStatus('この端末のみ（'+msg+'）', true);
  render();
}
function save(reason){
  if(!S) return;
  S.meta = S.meta||{}; S.meta.rev=(S.meta.rev||0)+1; S.meta.updatedAt=new Date().toISOString(); S.meta.by=TAB_ID;
  if(store.mode==='local'||store.mode==='error'||!store.ref){ lsSet(S); if(store.mode==='local') setStatus(PWA_BUILD?'この端末に保存済み':'この端末のみ（保存済み）', !PWA_BUILD); return; }
  clearTimeout(store.timer);
  setStatus('保存中…');
  store.timer=setTimeout(flush, 700);
}
function flush(){
  store.timer=null;
  if(store.writing){ store.pending=true; return; }
  var body=JSON.stringify(S);
  if(body.length>250000){ setStatus('データが大きすぎます（JSON出力して整理してください）', true); return; }
  store.writing=true; store.lastWritten=body;
  store.ref.set(JSON.parse(body)).then(function(){
    store.writing=false; setStatus('クラウド保存（同期済み）');
    if(store.pending){ store.pending=false; flush(); }
  }).catch(function(e){
    store.writing=false;
    var c=e&&e.code;
    if(c==='quota_exceeded'||c==='resource_exhausted') setStatus('保存容量の上限です', true);
    else if(c==='revoked'||c==='not_granted') setStatus('保存の権限がありません', true);
    else setStatus('保存できませんでした（再試行します）', true);
    lsSet(S);
    if(c!=='revoked'&&c!=='not_granted'&&c!=='invalid_argument') setTimeout(function(){ if(!store.writing) flush(); }, 5000);
  });
}
function migrate(d){
  d=d||{};
  d.schema=d.schema||1; d.profile=d.profile||{birthYear:1975,birthMonth:4};
  d.assetItems=d.assetItems||[]; d.months=d.months||{};
  d.plan=d.plan||{}; ['incomes','incomeRules','pensions','expenses','expenseRules'].forEach(function(k){ d.plan[k]=d.plan[k]||[]; });
  d.plan.savings=d.plan.savings||{monthly:0,bonusAnnual:0};
  d.assumptions=d.assumptions||defaultAssumptions();
  if(!d.assumptions.scenarios) d.assumptions.scenarios=E.clone(E.SCENARIOS_DEFAULT);
  d.insurance=d.insurance&&d.insurance.length?d.insurance:defaultInsurance();
  d.whatifs=d.whatifs||[]; d.audit=d.audit||[]; d.meta=d.meta||{rev:0};
  return d;
}
function audit(kind, target, before, after){
  S.audit.unshift({at:new Date().toISOString(), kind:kind, target:target, before:before===undefined?null:before, after:after===undefined?null:after});
  if(S.audit.length>300) S.audit.length=300;
}

function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function yen(v){ if(v===null||v===undefined||isNaN(v)) return '−'; return Math.round(v).toLocaleString('ja-JP')+'円'; }
/* 表示単位：千円（既定）または万円。設定で切替 */
/* 表示単位：円（既定）・千円・万円。設定で切替 */
function dispUnit(){ return (S&&S.display&&S.display.unit)||'yen'; }
function dispMan(){ return dispUnit()==='man'; }
function DUV(){ return unitMul(dispUnit()); }
function UL(){ return unitLabel(dispUnit()); }
function man(v, dec){ if(v===null||v===undefined||isNaN(v)) return '−'; var x=v/DUV(); dec=dec===undefined?(dispMan()&&Math.abs(x)<100?1:0):(dispMan()?dec:0); return x.toLocaleString('ja-JP',{minimumFractionDigits:dec,maximumFractionDigits:dec})+UL(); }
function manN(v){ if(v===null||v===undefined||isNaN(v)) return '−'; var x=v/DUV(); return x.toLocaleString('ja-JP',{maximumFractionDigits:dispMan()&&Math.abs(x)<100?1:0}); }
function axisFmt(v){ var a=Math.abs(v); if(a>=1e8) return (v/1e8).toLocaleString('ja-JP',{maximumFractionDigits:1})+'億'; if(a>=1e4) return (v/1e4).toLocaleString('ja-JP',{maximumFractionDigits:0})+'万'; return String(Math.round(v)); }
function signed(v, f){ if(v===null||v===undefined||isNaN(v)) return '−'; f=f||man; return (v>0?'＋':v<0?'−':'±')+f(Math.abs(v)); }
function pct(v, d){ if(v===null||v===undefined||isNaN(v)) return '−'; return (v*100).toFixed(d===undefined?1:d)+'%'; }
function spct(v){ if(v===null||v===undefined||isNaN(v)) return '−'; return (v>0?'＋':v<0?'−':'±')+Math.abs(v*100).toFixed(1)+'%'; }

function ymLabel(ym){ return ym? (E.ymYear(ym)+'年'+E.ymMonth(ym)+'月') : '−'; }
function usd(v){ return v===null||v===undefined||isNaN(v)?'−':'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function toHalf(s){ return String(s).replace(/[０-９．，－]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); }).replace(/ー/g,'-'); }
function parseNum(s){ if(s===null||s===undefined) return null; s=toHalf(s).replace(/[,\s円万%$]/g,''); if(s===''||s==='-') return null; var n=+s; return isNaN(n)?null:n; }
function unitMul(unit){ return unit==='man'?MAN:unit==='sen'?1000:1; }
function unitLabel(unit){ return unit==='man'?'万円':unit==='sen'?'千円':'円'; }
function toYen(s, unit){ var n=parseNum(s); if(n===null) return null; return Math.round(n*unitMul(unit)); }
function fromYen(v, unit){ if(v===null||v===undefined||v==='') return ''; return unit==='yen'? String(Math.round(v)) : String(+(v/unitMul(unit)).toFixed(4)); }

var chartRegistry=[];
function niceScale(min,max,n){
  if(min===max){ max=min+1; }
  var span=max-min, step=Math.pow(10,Math.floor(Math.log10(span/n))), err=span/n/step;
  if(err>=7.5) step*=10; else if(err>=3.5) step*=5; else if(err>=1.5) step*=2;
  return {min:Math.floor(min/step)*step, max:Math.ceil(max/step)*step, step:step};
}
function legendHtml(series, box){
  if(series.length<2) return '';
  return '<div class="legend">'+series.filter(function(s){return !s.noLegend;}).map(function(s){
    var st = s.dash? 'background:repeating-linear-gradient(90deg,'+s.color+' 0 5px,transparent 5px 8px)' : 'background:'+s.color;
    return '<span><i class="'+(box?'box':'')+'" style="'+st+'"></i>'+esc(s.name)+'</span>';
  }).join('')+'</div>';
}
/** cfg: {labels[], series[{name,color,values[],dash,width,fill}], type:'line'|'stack'|'bar', height, yFmt, tipLabel(i), band:{lo[],hi[]}, splitIndex} */
function drawChart(host, cfg){
  if(!host) return;
  host.innerHTML='';
  var W=Math.max(260, host.clientWidth||320), H=cfg.height||210, L=46, R=10, T=10, B=24;
  var n=cfg.labels.length; if(!n){ host.innerHTML='<div class="empty">データがありません</div>'; return; }
  var vals=[];
  if(cfg.type==='stack'){
    for(var i=0;i<n;i++){ var p=0,q=0; cfg.series.forEach(function(s){ var v=s.values[i]||0; if(v>=0)p+=v; else q+=v; }); vals.push(p,q); }
  } else cfg.series.forEach(function(s){ s.values.forEach(function(v){ if(v!==null&&!isNaN(v)) vals.push(v); }); });
  if(cfg.band){ cfg.band.lo.concat(cfg.band.hi).forEach(function(v){ if(v!==null) vals.push(v); }); }
  var mn=Math.min(0,Math.min.apply(null,vals)), mx=Math.max.apply(null,vals.concat([0]));
  var sc=niceScale(mn,mx,4);
  var iw=W-L-R, ih=H-T-B;
  var bar=cfg.type==='bar';
  function x(i){ return bar ? L+iw*(i+0.5)/n : L+(n===1?iw/2:iw*i/(n-1)); }
  function y(v){ return T+ih*(1-(v-sc.min)/(sc.max-sc.min)); }
  var yFmt=cfg.yFmt||axisFmt;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img" aria-label="'+esc(cfg.aria||'グラフ')+'">';
  for(var g=sc.min; g<=sc.max+1e-9; g+=sc.step){
    svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke-width="1" style="stroke:'+(Math.abs(g)<1e-9?'var(--line-2)':'var(--line)')+'"/>';
    svg+='<text x="'+(L-6)+'" y="'+(y(g)+3.5)+'" text-anchor="end">'+esc(yFmt(g))+'</text>';
  }
  var every=Math.max(1,Math.ceil(n/(W<420?5:8)));
  for(var j=0;j<n;j++){ if(j%every===0||j===n-1&&n<=12) svg+='<text x="'+x(j)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(cfg.xFmt?cfg.xFmt(j):cfg.labels[j])+'</text>'; }
  if(cfg.splitIndex!==undefined&&cfg.splitIndex!==null){ var sx=x(cfg.splitIndex); svg+='<line x1="'+sx+'" x2="'+sx+'" y1="'+T+'" y2="'+(T+ih)+'" style="stroke:var(--line-2)" stroke-dasharray="2 3"/><text x="'+(sx+4)+'" y="'+(T+10)+'" text-anchor="start">予測（概算）→</text>'; }
  if(cfg.band){
    var d='', idx=[];
    for(var b=0;b<n;b++) if(cfg.band.hi[b]!==null&&cfg.band.lo[b]!==null&&cfg.band.hi[b]!==undefined) idx.push(b);
    idx.forEach(function(b,k){ d+=(k?'L':'M')+x(b)+','+y(cfg.band.hi[b]); });
    idx.slice().reverse().forEach(function(b){ d+='L'+x(b)+','+y(cfg.band.lo[b]); });
    if(idx.length) svg+='<path d="'+d+'Z" style="fill:var(--band);stroke:none"/>';
  }
  if(cfg.type==='stack'){
    var base=new Array(n).fill(0);
    cfg.series.forEach(function(s){
      var top=base.map(function(b0,i){ return b0+Math.max(0,s.values[i]||0); });
      var d2='';
      for(var i=0;i<n;i++) d2+=(i?'L':'M')+x(i)+','+y(top[i]);
      for(var i2=n-1;i2>=0;i2--) d2+='L'+x(i2)+','+y(base[i2]);
      svg+='<path d="'+d2+'Z" style="fill:'+s.color+';fill-opacity:.85;stroke:var(--surface)" stroke-width="1.5"/>';
      base=top;
    });
  } else if(bar){
    var k=cfg.series.length, bw=Math.max(3,Math.min(16,iw/n/(k+0.8)));
    cfg.series.forEach(function(s,si){
      s.values.forEach(function(v,i){
        if(v===null||isNaN(v)) return;
        var cx=x(i)-(k*bw+(k-1)*2)/2+si*(bw+2);
        var y0=y(0), y1=y(v), h=Math.abs(y1-y0);
        svg+='<rect x="'+cx+'" y="'+Math.min(y0,y1)+'" width="'+bw+'" height="'+Math.max(1,h)+'" rx="2" style="fill:'+s.color+'"/>';
      });
    });
  } else {
    cfg.series.forEach(function(s){
      var d3='', started=false;
      s.values.forEach(function(v,i){ if(v===null||isNaN(v)){ started=false; return; } d3+=(started?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1); started=true; });
      svg+='<path d="'+d3+'" fill="none" style="stroke:'+s.color+'" stroke-width="'+(s.width||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+'/>';
      if(s.points) s.values.forEach(function(v,i){ if(v!==null&&!isNaN(v)) svg+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" stroke-width="2" style="fill:'+s.color+';stroke:var(--surface)"/>'; });
      if(s.endLabel){ var li=s.values.length-1; while(li>0&&(s.values[li]===null)) li--; svg+='<text x="'+(x(li)-2)+'" y="'+(y(s.values[li])-6)+'" text-anchor="end" style="fill:var(--ink-2);font-weight:600">'+esc(s.endLabel)+'</text>'; }
    });
  }
  svg+='<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(T+ih)+'" stroke-width="1" style="stroke:var(--ink-3);display:none"/>';
  svg+='<g class="dots"></g></svg>';
  host.innerHTML=legendHtml(cfg.series.filter(function(s){return !s.noLegend;}), cfg.type!=='line')+svg+'<div class="tip" style="display:none"></div>';
  var el=host.querySelector('svg'), tip=host.querySelector('.tip'), xh=host.querySelector('.xh'), dots=host.querySelector('.dots');
  function show(ev){
    var rect=el.getBoundingClientRect(), px=(ev.clientX-rect.left)*(W/rect.width);
    var i=bar? Math.floor((px-L)/iw*n) : Math.round((px-L)/iw*(n-1));
    i=Math.max(0,Math.min(n-1,i));
    xh.setAttribute('x1',x(i)); xh.setAttribute('x2',x(i)); xh.style.display='';
    var html='<b>'+esc(cfg.tipLabel?cfg.tipLabel(i):cfg.labels[i])+'</b>', dd='';
    var list=cfg.series.slice(); if(cfg.type==='stack') list=list.slice().reverse();
    var tot=0;
    list.forEach(function(s){
      var v=s.values[i]; if(v===null||v===undefined||isNaN(v)) return; tot+=v;
      html+='<br><span class="sw" style="background:'+s.color+'"></span>'+esc(s.name)+'　'+esc(cfg.tipFmt?cfg.tipFmt(v):man(v));
      if(cfg.type==='line') dd+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4.5" stroke-width="2" style="fill:'+s.color+';stroke:var(--surface)"/>';
    });
    if(cfg.type==='stack') html+='<br><b>合計　'+esc(man(tot))+'</b>';
    if(cfg.tipExtra) html+=cfg.tipExtra(i);
    dots.innerHTML=dd;
    tip.innerHTML=html; tip.style.display='';
    var left=x(i)/W*rect.width, tw=tip.offsetWidth;
    left=Math.max(tw/2+2, Math.min(rect.width-tw/2-2, left));
    tip.style.left=left+'px'; tip.style.top=(host.querySelector('.legend')?22:0)+'px';
  }
  function hide(){ tip.style.display='none'; xh.style.display='none'; dots.innerHTML=''; }
  el.addEventListener('pointermove',show); el.addEventListener('pointerdown',show);
  el.addEventListener('pointerleave',hide);
}
function donut(host, parts){
  var tot=parts.reduce(function(s,p){return s+Math.max(0,p.value);},0);
  if(!tot){ host.innerHTML='<div class="empty">データがありません</div>'; return; }
  var R=62, r=40, cx=72, cy=72, a=-Math.PI/2, svg='<svg viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="資産構成">';
  parts.forEach(function(p){
    var f=p.value/tot; if(f<=0) return;
    var a2=a+f*Math.PI*2-(parts.length>1?0.025:0), large=(a2-a)>Math.PI?1:0;
    if(f>0.9999){ svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((R+r)/2)+'" fill="none" stroke-width="'+(R-r)+'" style="stroke:'+p.color+'"/>'; }
    else svg+='<path d="M'+(cx+R*Math.cos(a))+','+(cy+R*Math.sin(a))+'A'+R+','+R+' 0 '+large+' 1 '+(cx+R*Math.cos(a2))+','+(cy+R*Math.sin(a2))+'L'+(cx+r*Math.cos(a2))+','+(cy+r*Math.sin(a2))+'A'+r+','+r+' 0 '+large+' 0 '+(cx+r*Math.cos(a))+','+(cy+r*Math.sin(a))+'Z" style="fill:'+p.color+'"/>';
    a=a+f*Math.PI*2;
  });
  svg+='</svg>';
  host.innerHTML='<div class="row" style="align-items:center;gap:14px">'+svg+'<div style="flex:1;min-width:0">'+parts.map(function(p){
    return '<div class="row between" style="font-size:12.5px;padding:3px 0"><span class="row" style="gap:6px;min-width:0"><span class="dot" style="background:'+p.color+'"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.label)+'</span></span><span class="num">'+pct(p.value/tot)+'</span></div>';
  }).join('')+'</div></div>';
}

function history(){ return E.computeHistory(S); }
function baseYm(){ return E.latestClosedYm(S); }
function pgfApprox(ym){ // 概算（参考）：試算条件によるその月末の円換算
  var p=policy('pgf'); if(!p) return null;
  if(insVal(p, ym)!==null) return null;
  if(ym<p.contract.startYm) return null;
  return E.pgfValueAt(p, p.sim, ym, ym).jpy;
}
function unconfirmedPaid(ym){ // 未確認保険の払込済み額（概算）
  var tot=0;
  S.insurance.forEach(function(p){
    if(insVal(p, ym)!==null) return;
    if(p.kind==='pgf'){ if(ym>=p.contract.startYm) tot+=p.contract.premiumJpy; return; }
    var months=Math.max(0, E.ymIndex(ym)-E.ymIndex(p.contract.startYm)+1);
    var payEndYm=(S.profile.birthYear+p.contract.payEndAge)+'-12';
    if(ym>payEndYm) months=Math.max(0,E.ymIndex(payEndYm)-E.ymIndex(p.contract.startYm)+1);
    tot+=months*E.premiumAnnual(p)/12;
  });
  return tot;
}
function ratePresets(){ var p=policy('pgf'), r=p&&p.contract.rate?Math.round(p.contract.rate*1000)/10:null; var a=[3,4,6]; if(r!==null&&a.indexOf(r)<0) a.push(r); return a.sort(function(x,y){return x-y;}); }
function fxPresets(){ var p=policy('pgf'), f=p&&p.contract.fx; var a=[130,140,150,170,180]; if(f&&a.indexOf(+f)<0) a.push(+f); return a.sort(function(x,y){return x-y;}); }
function insCo(id){ var p=policy(id); return p?p.company:''; }
function insLabel(id){ var p=policy(id); if(!p) return ''; return p.short||String(p.company).replace(/日動あんしん生命$/,'').replace(/生命$/,''); }
function insVal(p, ym){ return E.insuranceAssetJpy(p, ym, S.profile.birthYear).jpy; } // 総資産に計上する額（'+insLabel('pgf')+'は公式値がなければ概算）
function insEst(p, ym){ return E.insuranceAssetJpy(p, ym, S.profile.birthYear).estimate; }
function toUnconf(ym){ var m=S.months[ym]; if(!m) return 0; var tot=0; (m.transfers||[]).forEach(function(t){ var it=item(t.to); if(it&&it.forecast==='insurance'){ var p=policy(it.policyId); if(p&&insVal(p,ym)===null) tot+=+t.amount; } }); return tot; }

function derivedText(r){
  var parts=[];
  if(r.mode==='INS'){
    parts.push(r.end===null?'未登録のため総資産に含めない（保険タブで登録）':'月末 '+yen(r.end)+(r.estimate?'（概算・総資産に計上）':''));
    if(r.premiumAdd) parts.push('保険料の積立 ＋'+yen(r.premiumAdd));
    if(r.trIn) parts.push('振替入 '+yen(r.trIn));
    return parts.map(function(p){return '<span>'+p+'</span>';}).join('');
  }
  parts.push('<b>月末 '+(r.end===null?'−':yen(r.end))+'</b>');
  if(r.trIn) parts.push('振替入 '+yen(r.trIn));
  if(r.trOut) parts.push('振替出 '+yen(r.trOut));
  if(r.val) parts.push('評価増減 <span class="'+cls(r.val)+'">'+signed(r.val,yen)+'</span>');
  if(r.unc) parts.push('未区分 <span class="'+cls(r.unc)+'">'+signed(r.unc,yen)+'</span>');
  parts.push('<span class="muted">'+MODE_LABEL[r.mode]+'</span>');
  var w=[];
  if(r.end!==null&&r.end<0&&r.forecast!=='liability') w.push('月末残高がマイナスです');
  if(r.prev&&r.end!==null&&Math.abs(r.end-r.prev)/Math.abs(r.prev)>0.5&&!r.trIn&&!r.trOut) w.push('前月比±50%超です。入力を確認してください');
  if(r.mode==='A'&&r.prev&&Math.abs(r.val)/Math.abs(r.prev)>0.2) w.push('評価増減が前月残高の±20%を超えています（入出金の入力漏れ？）');
  return parts.map(function(p){return '<span>'+p+'</span>';}).join('')+(w.length?'<div class="note warn" style="width:100%;margin:6px 0 0">'+w.join('<br>')+'</div>':'');
}

function bridgeHtml(rows){

    var v=r[1], isBase=r[2]==='base', left, width, color;

    else { var a=run, b2=run+v; left=Math.min(a,b2)/max*100; width=Math.abs(v)/max*100; color=v>=0?'var(--up)':'var(--down)'; run=b2; }
    return '<div class="bar-h"><span>'+r[0]+'</span><div class="track"><div class="fill" style="left:'+Math.max(0,left)+'%;width:'+Math.max(0.6,width)+'%;background:'+color+'"></div></div><span class="num" style="text-align:right">'+(isBase?man(v):signed(v))+'</span></div>';
  }).join('');
}

function readChange(form, type){

  switch(type){
    case 'retire': case 'fullRetire': return {type:type, age:a('age')};
    case 'jobChange': return {type:type, value:p('value')||0};
    case 'income': var meth=g('method'); return {type:type, target:g('target'), age:a('age'), method:meth, value:meth==='amount'?m('value'):meth==='ratio'?p('value'):0};
    case 'incomeGrowth': return {type:type, value:p('value')||0};
    case 'expense': var me=g('method'); return {type:type, target:g('target'), age:a('age'), method:me, value:me==='amount'?m('value'):me==='stop'?0:p('value')};
    case 'travel': return {type:type, amount:m('amount'), startAge:a('startAge'), endAge:a('endAge')};
    case 'special': return {type:type, name:g('name'), amount:m('amount'), atAge:a('atAge'), everyN:a('everyN')||0, lastAge:a('lastAge')};
    case 'saving': return {type:type, monthly:m('monthly')||0, endAge:a('endAge')};

    case 'pgfFx': return {type:type, value:parseNum(g('value'))};
    case 'pension': var ie=g('investEnabled'); return {type:type, startAge:a('startAge'), amount:m('amount'), investEnabled:ie===''?null:ie==='1', investUntil:a('investUntil'), investRate:p('investRate')};

function applyWhatIfToPlan(){
  var A=S.assumptions, before=E.clone({a:A, plan:S.plan, sim:policy('pgf').sim});
  ui.wi.changes.filter(function(c){return c.enabled!==false;}).forEach(function(c){
    switch(c.type){
      case 'retire': A.retireAge=c.age; if(A.fullRetireAge!==null&&A.fullRetireAge!==undefined&&A.fullRetireAge<c.age) A.fullRetireAge=c.age; break;
      case 'fullRetire': A.fullRetireAge=c.age; if(A.retireAge>c.age) A.retireAge=c.age; break;
      case 'jobChange': A.jobChangeRate=c.value; break;
      case 'income': S.plan.incomeRules.push({target:c.target, age:c.age, method:c.method, value:c.value}); break;
      case 'incomeGrowth': S.plan.incomes.forEach(function(x){ if(x.type!=='oneoff') x.growth=c.value; }); break;
      case 'expense': S.plan.expenseRules.push({target:c.target, age:c.age, method:c.method, value:c.value}); break;
      case 'travel': S.plan.expenses.push({id:uid('ex'), name:'旅行（WHAT IFから）', group:'variable', amount:c.amount, period:'y', startAge:c.startAge, endAge:c.endAge, inflate:true, retireFactor:1}); break;
      case 'special': S.plan.expenses.push({id:uid('ex'), name:c.name||'特別支出', group:'special', amount:c.amount, atAge:c.atAge, everyN:c.everyN, lastAge:c.lastAge, inflate:true}); break;
      case 'saving': S.plan.savings.monthly=c.monthly; if(c.endAge) S.plan.savings.endAge=c.endAge; break;
      case 'rate': A.scenarios[A.scenario].r=c.value; break;
      case 'inflation': A.scenarios[A.scenario].i=c.value; break;
      case 'pension': var q=S.plan.pensions[0]; if(q){ if(c.startAge) q.startAge=c.startAge; if(c.amount!==null&&c.amount!==undefined){ q.amount=c.amount; q.period='y'; q.amountMode='manual'; } q.invest=q.invest||{enabled:false,untilAge:70,rate:0.05}; if(c.investEnabled!==null&&c.investEnabled!==undefined) q.invest.enabled=c.investEnabled; if(c.investUntil) q.invest.untilAge=c.investUntil; if(c.investRate!==null&&c.investRate!==undefined) q.invest.rate=c.investRate; } break;
      case 'oneoff': S.plan.incomes.push({id:uid('inc'), name:c.name||'一時収入', type:'oneoff', amount:c.amount, atAge:c.atAge}); break;
      case 'pgfRate': policy('pgf').sim.rate=c.value; break;   // 試算条件のみ（契約条件は更新しない）
      case 'pgfRate2': policy('pgf').sim.rate2=c.value; break;
      case 'pgfFx': policy('pgf').sim.fx=c.value; break;
      case 'pgfFxGrowth': policy('pgf').sim.fxGrowth=c.value; break;
    }
  });
  audit('WHAT IFを計画に反映','計画・前提条件・'+insLabel('pgf')+'試算条件', before, E.clone({a:A, plan:S.plan, sim:policy('pgf').sim}));
  ui.wi.changes=[];
  save(); toast('計画に反映しました（'+insLabel('pgf')+'は試算条件のみ更新）'); render();
}

function paidFor(p, ym){

  var end=(S.profile.birthYear+p.contract.payEndAge)+'-12'; if(ym>end) months=Math.max(0,E.ymIndex(end)-E.ymIndex(p.contract.startYm)+1);

    return p.contract.parts.reduce(function(s,c){ var st=c.date.slice(0,7); var mm=Math.max(0,E.ymIndex(ym>end?end:ym)-E.ymIndex(st)+1); return s+mm*c.monthly; },0);
  }
  return months*E.premiumAnnual(p)/12;
}
