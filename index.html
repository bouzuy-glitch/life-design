function aiAnswer(id){
  if(!baseYm()) return {a:'計算できません。確定した月の残高を入力してください。'};
  var A=S.assumptions, age=curAge(), endAge=A.endAge;
  function wi(ch, scn){ return LDTools.run_whatif(ch, scn); }
  function m100(r){ var row=r.rows[r.rows.length-1]; return A.realView?row.real:row.total; }
  function dep(r){ return r.depletionAge?r.depletionAge+'歳で資産が不足':''+endAge+'歳まで不足なし'; }
  var unit=A.realView?'実質':'名目', ch=null, concl='', ev=[], prem=[], warn=[];
  switch(id){
    case 'reduce60':
      ch=[{type:'income', target:'salary', age:Math.max(60,age+1), method:'ratio', value:-0.5}];
      var r=wi(ch), rl=wi(ch,'low');
      concl=r.after.depletionAge?'60歳から給与を半分にすると、'+r.after.depletionAge+'歳で資産が不足する計算です。':'60歳から給与を半分にしても、'+endAge+'歳まで資産は尽きない計算です。';
      ev=['100歳時点の資産：'+man(m100(r.after),0)+'（現状維持 '+man(m100(r.base),0)+'、差 '+signed(m100(r.after)-m100(r.base))+'・'+unit+'）','慎重シナリオでは：'+dep(rl.after)];
      prem=['「仕事を減らす」を、'+Math.max(60,age+1)+'歳から給与系の手取りが50%減ると仮定'];
      break;
    case 'travel':
      ch=[{type:'travel', amount:1000000, startAge:age+1, endAge:Math.min(75,endAge)}];
      var r2=wi(ch), rl2=wi(ch,'low');
      concl=r2.after.depletionAge?'毎年100万円を旅行に使うと、'+r2.after.depletionAge+'歳で資産が不足する計算です。':'毎年100万円を旅行に使っても、'+endAge+'歳まで資産は尽きない計算です。';
      ev=['100歳時点の資産：'+man(m100(r2.after),0)+'（差 '+signed(m100(r2.after)-m100(r2.base))+'・'+unit+'）','慎重シナリオでは：'+dep(rl2.after)];
      prem=['旅行費 年100万円（今日の物価・インフレ連動）を'+(age+1)+'〜'+Math.min(75,endAge)+'歳に追加'];
      break;
    case 'car':
      ch=[{type:'special', name:'車の買い替え', amount:4000000, atAge:age+1, everyN:10, lastAge:Math.max(age+1,75)}];
      var r3=wi(ch), rl3=wi(ch,'low');
      concl=r3.after.depletionAge?'車の買い替え（400万円・10年ごと）を加えると、'+r3.after.depletionAge+'歳で資産が不足する計算です。':'車の買い替え（400万円・10年ごと）を加えても、'+endAge+'歳まで資産は尽きない計算です。';
      ev=['100歳時点の資産の変化：'+signed(m100(r3.after)-m100(r3.base))+'（'+unit+'）','完全退職時の資産：'+man(r3.base.retireAssets,0)+' → '+man(r3.after.retireAssets,0)+'（名目）','慎重シナリオでは：'+dep(rl3.after)];
      prem=['購入額400万円、'+(age+1)+'歳から10年ごと、'+Math.max(age+1,75)+'歳まで（金額は相談例の仮定。WHAT IFで変更できます）'];
      break;
    case 'saving':
      var sv=S.plan.savings.monthly||0, list=[0.5,1,1.5,2].map(function(k){ var c=[{type:'saving', monthly:Math.round(sv*k)}]; var x=wi(c); return {k:k, v:m100(x.after), d:x.after.depletionAge, ch:c}; });
      ch=list[2].ch;
      concl='積立額を増やすほど100歳時点の資産は増えます（現在：月'+man(sv)+'）。現金が生活防衛資金を下回る年は計算上自動で積立が減ります。';
      ev=list.map(function(x){ return '月'+man(Math.round(sv*x.k))+'：100歳時点 '+man(x.v,0)+'（'+unit+'）'+(x.d?'・'+x.d+'歳で不足':''); });
      prem=['積立先の運用利回り：'+A.scenarios[A.scenario].label+'シナリオ（'+pct(A.scenarios[A.scenario].r)+'、項目別の設定あり）'];
      break;
    case 'retire':
      var ra=LDTools.find_required_value('min_retire_age');
      ch=ra?[{type:'fullRetire', age:ra}]:null;
      concl=ra===null?'50〜80歳のどの完全退職年齢でも、'+endAge+'歳までに資産が不足する計算です。支出や積立の見直しが必要です。':'「'+endAge+'歳まで資産が尽きない」を満たす最も早い完全退職年齢は '+ra+'歳 です（現在の設定 '+E.fullRetireOf(A)+'歳）。';
      if(ra){ var lowRa=E.findMinRetireAge(futureInput('low')); ev=['標準以外：慎重シナリオでは '+(lowRa?lowRa+'歳':'80歳までに条件を満たさない')]; }
      prem=['完全退職年齢を変えても年金額は変わらない前提','完全退職後は給与系収入が0、積立も終了（転職後は転職後の収入で計算）'];
      break;
    case 'income':
      var base=[{type:'income', target:'salary', age:age+1, method:'ratio', value:-0.2}];
      var rr=wi(base);
      var need=null;
      if(rr.after.depletionAge){ for(var k=1;k<=50;k++){ var x=wi(base.concat([{type:'expense', target:'fixed', age:age+1, method:'ratio', value:-k/100}])); if(!x.after.depletionAge){ need=k; break; } } }
      ch=need?base.concat([{type:'expense', target:'fixed', age:age+1, method:'ratio', value:-need/100}]):base;
      concl=!rr.after.depletionAge?'収入が20%減っても、生活費を変えずに'+endAge+'歳まで資産は尽きない計算です。':need?'収入が20%減った場合、固定生活費を約'+need+'%減らすと'+endAge+'歳まで資産が持つ計算です。':'収入が20%減った場合、固定生活費を50%減らしても不足する計算です。';
      ev=['収入20%減・生活費そのまま：'+dep(rr.after)+'、100歳時点 '+man(m100(rr.after),0)+'（'+unit+'）'];
      prem=[(age+1)+'歳から給与系の手取りが20%減ると仮定'];
      break;
    case 'fx':
      var p=policy('pgf');
      var rows=[130,140,150].map(function(f){ var x=wi([{type:'pgfFx', value:f}]); var r20=E.pgfTableUsd(p.contract.principalUsd,p.sim.rate,20)*f; return {f:f, d:m100(x.after)-m100(x.base), r20:r20}; });
      ch=[{type:'pgfFx', value:140}];
      concl='円高になると、'+insCo('pgf')+'の米ドル額は変わらず、円換算額だけが減ります。';
      ev=['20年後の円換算額（年率'+pct(p.sim.rate,2)+'）：'+rows.map(function(x){return x.f+'円 '+man(x.r20,0);}).join('／')+'（現在の試算為替 '+p.sim.fx+'円 '+man(E.pgfTableUsd(p.contract.principalUsd,p.sim.rate,20)*p.sim.fx,0)+'）']
        .concat(rows.map(function(x){ return '為替'+x.f+'円のとき100歳時点の総資産の差：'+signed(x.d)+'（'+unit+'）'; }));
      prem=['為替は一定と仮定。契約条件（'+pct(p.contract.rate,2)+'・'+p.contract.fx+'円・'+usd(p.contract.principalUsd)+'）は変更していません'];
      warn.push('保険会社が将来の積立利率や受取額を保証するものではありません。');
      break;
    case 'review':
      var cands=[
        ['運用利回り＋1%',[{type:'rate', value:A.scenarios[A.scenario].r+0.01}]],
        ['積立額＋月2万円',[{type:'saving', monthly:(S.plan.savings.monthly||0)+20000}]],
        ['完全退職を2年遅らせる',[{type:'fullRetire', age:Math.min(85,E.fullRetireOf(A)+2)}]],
        ['固定生活費−10%',[{type:'expense', target:'fixed', age:age+1, method:'ratio', value:-0.1}]],
        ['変動生活費−20%',[{type:'expense', target:'variable', age:age+1, method:'ratio', value:-0.2}]],
        ['インフレ率＋1%（悪化）',[{type:'inflation', value:A.scenarios[A.scenario].i+0.01}]]
      ].map(function(c){ var x=wi(c[1]); return {n:c[0], c:c[1], d:m100(x.after)-m100(x.base)}; }).sort(function(a,b){return b.d-a.d;});
      ch=cands[0].c;
      concl='100歳時点の資産への影響が最も大きいのは「'+cands[0].n+'」です（'+signed(cands[0].d)+'・'+unit+'）。';
      ev=cands.map(function(c){ return c.n+'：'+signed(c.d); });
      prem=['主要な条件を一つずつ変えた感応度の比較（他の条件は現状維持）'];
      break;
  }
  var cardId=uid('calc');
  var html='<h4>結論</h4><div>'+esc(concl)+'</div>'+(ev.length?'<h4>根拠（計算結果）</h4><ul style="margin:0;padding-left:18px">'+ev.map(function(e){return '<li class="num">'+esc(e)+'</li>';}).join('')+'</ul>':'')+
    '<h4>前提条件</h4><ul style="margin:0;padding-left:18px">'+prem.concat([A.scenarios[A.scenario].label+'シナリオ（利回り'+pct(A.scenarios[A.scenario].r)+'・インフレ'+pct(A.scenarios[A.scenario].i)+'）、退職'+A.retireAge+'歳、起点 '+ymLabel(baseYm())+'末']).map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>'+
    '<h4>注意</h4><div class="sub">将来予測は前提に基づく試算であり、結果は保証されません。'+warn.join('')+'特定の金融商品の売買や保険の解約・乗換を勧めるものではありません。必要に応じてFP・税理士にご相談ください。</div>'+
    '<div class="evidence">根拠カード：計算ID '+cardId+'／計算日時 '+new Date().toLocaleString('ja-JP')+'／エンジン v'+E.VERSION+(ch?'<br>変更内容：'+ch.map(chipText).join('、'):'')+'</div>'+

}
function aiRoute(text){
  var map=[[/旅行/,'travel'],[/車/,'car'],[/積立/,'saving'],[/何歳|退職|働/,'retire'],[/円高|為替|ドル|PGF/,'fx'],[/収入|減っ|給料/,'income'],[/見直|増や/,'review'],[/60歳|仕事を減/,'reduce60']];
  for(var i=0;i<map.length;i++) if(map[i][0].test(text)) return map[i][1];
  return null;
}

function manVal(n){ var v=parseNum(fv(n)); return v===null?null:Math.round(v); } // シートの金額は円単位
function intVal(n){ var v=parseNum(fv(n)); return v===null?null:Math.round(v); }
function pctVal(n){ var v=parseNum(fv(n)); return v===null?null:v/100; }

    numField('order','表示順',it.order||50,'')+
    '<label class="f"><span>終了月（解約・売却。空欄＝継続）</span><input class="inp" type="month" name="endYm" value="'+esc(it.endYm||'')+'"></label>'+
    '<label class="f"><span>メモ</span><textarea class="inp" name="note">'+esc(it.note||'')+'</textarea></label>';
  openSheet(isNew?'資産項目を追加':'資産項目を編集', body, function(){
    var name=(fv('name')||'').trim(); if(!name){ toast('項目名を入力してください'); return false; }

    if(isNew){ it.startYm=null; S.assetItems.push(it); }

    confirmSheet('資産項目の削除','「'+esc(it.name)+'」を削除しますか？過去月の入力もこの項目分は表示されなくなります（残したい場合は終了月を設定してください）。','削除する',function(){
      S.assetItems=S.assetItems.filter(function(x){return x.id!==it.id;}); audit('資産項目を削除', it.name, E.clone(it), null); save(); render();
    }, true); return false;

}

function num0(v){ return v===null||v===undefined||v===''||isNaN(+v)?0:+v; }
function ruleSheet(i){

  var body=selField('target','対象',[['salary','給与系すべて'],['all','すべての収入']].concat(S.plan.incomes.filter(function(x){return x.type!=='oneoff';}).map(function(x){return [x.id,x.name];})),r.target)+

}
function retxRule(g){ return (S.plan.expenseRules||[]).filter(function(r){ return r.atFullRetire&&r.target===g; })[0]; }
/* ---------- 期間別の収入（給与系・年齢で区切って月額を設定。D-19） ---------- */
function salInp(){ var A=S.assumptions; return {incomes:S.plan.incomes, incomeRules:S.plan.incomeRules, retireAge:+A.retireAge||65, fullRetireAge:E.fullRetireOf(A), jobChangeRate:+A.jobChangeRate||0}; }
function incHasPlan(){ return (S.plan.incomeRules||[]).some(function(r){ return r.periodPlan; }); }
function incPeriods(){
  var cur=curAge(), FR=E.fullRetireOf(S.assumptions), inp=salInp(), A=S.assumptions;
  var b=[cur]; if(+A.retireAge>cur&&+A.retireAge<FR) b.push(+A.retireAge);
  (S.plan.incomeRules||[]).forEach(function(r){ if(+r.age>cur&&+r.age<FR) b.push(+r.age); });
  b=b.filter(function(v,i,a){return a.indexOf(v)===i;}).sort(function(x,y){return x-y;});
  var rows=b.map(function(a,i){ return {from:i===0?null:a, monthly:Math.round(E.salaryAt(inp,a)/12)}; });
  return rows.filter(function(r,i){ return i===0||r.monthly!==rows[i-1].monthly; });
}
function incPeriodCard(){
  var sal=S.plan.incomes.filter(function(x){return x.type==='salary';}); if(!sal.length) return '';
  var rows=incPeriods(), FR=E.fullRetireOf(S.assumptions), has=incHasPlan();
  var lines=rows.map(function(r,i){ var to=i<rows.length-1?rows[i+1].from-1:FR-1; return '<div class="row between" style="font-size:13.5px;padding:4px 0;border-bottom:1px solid var(--line)"><span>'+(r.from?r.from+'歳':'今')+'〜'+to+'歳</span><b class="num">月 '+yen(r.monthly)+'</b></div>'; }).join('')+
    '<div class="row between" style="font-size:13.5px;padding:4px 0"><span>'+FR+'歳〜（完全退職）</span><b class="num">0円</b></div>';
  return '<div class="card"><div class="row between"><div style="font-weight:650">期間別の収入（給与・手取り）'+(has?'':' <span class="badge na">未設定</span>')+'</div><button class="btn sm '+(has?'':'primary')+'" data-act="incperiod-edit">'+(has?'期間と金額を変更':'期間別に設定')+'</button></div>'+
    '<div class="sub" style="margin:4px 0 6px">'+(has?'区切りの年齢と月額を自由に変えて試算できます。':'今の設定から見た給与の流れです。「期間別に設定」で、区切りの年齢と月額（手取り）を自由に決められます。')+'</div>'+lines+'</div>';
}
function incPeriodSheet(){
  var FR=E.fullRetireOf(S.assumptions), rows=incPeriods(), sal=S.plan.incomes.filter(function(x){return x.type==='salary';});
  var old=(S.plan.incomeRules||[]).filter(function(r){ return r.target==='salary'||r.target==='all'||sal.some(function(x){return x.id===r.target;}); });
  var body='<p class="sub">給与（手取り）の月額を、年齢で区切って入れます。「今」から始まり、各期間は次の区切りの前の年まで続きます。完全退職年齢（'+FR+'歳）からは0円です（「未来」タブで変更できます）。区切りはいくつでも増やせます。</p>'+
    '<div id="prows">'+periodRowsHtml(rows)+'</div><button type="button" class="btn sm" data-act="period-add" data-max="'+(FR-1)+'">＋ 区切りを追加</button>'+
    '<div class="note warn" style="margin-top:10px">保存すると、給与は期間別の金額で計算します。'+(old.length?'今ある給与の収入ルール（'+old.map(function(r){return r.age+'歳から '+ruleText(r);}).join('、')+'）は削除します。':'')+(+S.assumptions.jobChangeRate?'「転職後の収入（'+spct(+S.assumptions.jobChangeRate)+'）」は使わず0%にします。':'')+(sal.length>1?'給与の項目が複数あるので、各期間の合計をこの金額にします（項目の比率は今のまま）。':'')+'</div>'+
    '<p class="sub">金額は手取り・今日の金額で入れてください。</p>';
  openSheet('期間別の収入（給与）', body, function(){
    var rs=readPeriodRows(), cur=curAge();
    for(var i=0;i<rs.length;i++){
      if(rs[i].monthly===null||rs[i].monthly<0){ toast((i===0?'最初':'区切り'+i)+'の月額を入力してください'); return false; }
      if(i>0&&(!rs[i].from||rs[i].from<=cur||rs[i].from>=FR)){ toast('区切りの年齢は'+(cur+1)+'〜'+(FR-1)+'歳で入力してください'); return false; }
      if(i>1&&rs[i].from<=rs[i-1].from){ toast('区切りの年齢は小さい順に入力してください'); return false; }
    }
    var before=E.clone({rules:S.plan.incomeRules, inc:sal, jc:S.assumptions.jobChangeRate});
    S.plan.incomeRules=(S.plan.incomeRules||[]).filter(function(r){ return old.indexOf(r)<0; });
    if(sal.length===1){ sal[0].amount=Math.round(rs[0].monthly); sal[0].period='m'; }
    else S.plan.incomeRules.push({target:'salary', age:cur, method:'amount', value:Math.round(rs[0].monthly*12), periodPlan:true});
    rs.slice(1).forEach(function(r){ S.plan.incomeRules.push({target:'salary', age:r.from, method:'amount', value:Math.round(r.monthly*12), periodPlan:true}); });
    if(sal.length===1&&rs.length===1) S.plan.incomeRules.push({target:'salary', age:cur, method:'ratio', value:0, periodPlan:true}); // 期間別で設定済みの印
    S.assumptions.jobChangeRate=0;
    audit('期間別の収入（給与）を設定', rs.map(function(r){return (r.from||'今')+'〜:月'+Math.round(r.monthly);}).join(' / '), before, null);
    return true;
  }, {saveLabel:'この内容で計算'});
}
/* ---------- 期間別の生活費（年齢で区切って金額を設定） ---------- */
function periodItems(g){ return S.plan.expenses.filter(function(e){ return e.group===g&&e.periodPlan; }); }
function groupMonthlyAt(g, age){ // その年齢で有効な項目の月額合計（ルールは含めない）
  return S.plan.expenses.filter(function(e){ return e.group===g&&e.group!=='special'&&(!e.startAge||age>=+e.startAge)&&(!e.endAge||age<=+e.endAge); })
    .reduce(function(t,e){ return t+(e.period==='y'?+e.amount/12:+e.amount); },0);
}
function currentPeriods(g){
  var cur=curAge(), end=+S.assumptions.endAge||100;
  var pi=periodItems(g);
  if(pi.length){ return pi.slice().sort(function(a,b){ return (+a.startAge||0)-(+b.startAge||0); }).map(function(e){ return {from:e.startAge?+e.startAge:null, monthly:+e.amount}; }); }
  // 既存の項目から、金額が変わる年齢で区切って初期値を作る
  var bounds=[cur];
  S.plan.expenses.forEach(function(e){ if(e.group!==g) return; if(e.startAge&&+e.startAge>cur) bounds.push(+e.startAge); if(e.endAge&&+e.endAge+1>cur&&+e.endAge+1<=end) bounds.push(+e.endAge+1); });
  var fr=retxRule(g); if(fr){ var fa=E.fullRetireOf(S.assumptions); if(fa>cur) bounds.push(fa); }
  bounds=bounds.filter(function(v,i,a){ return a.indexOf(v)===i; }).sort(function(a,b){return a-b;});
  var rows=bounds.map(function(b,i){ var m=(fr&&b>=E.fullRetireOf(S.assumptions))?fr.value/12:groupMonthlyAt(g,b); return {from:i===0?null:b, monthly:Math.round(m)}; });
  return rows.filter(function(r,i){ return i===0||r.monthly!==rows[i-1].monthly; });
}
function periodCard(g){
  var nm=g==='fixed'?'固定生活費':'変動生活費', rows=currentPeriods(g), end=+S.assumptions.endAge||100, has=periodItems(g).length>0;
  var lines=rows.map(function(r,i){ var to=i<rows.length-1?rows[i+1].from-1:end; return '<div class="row between" style="font-size:13.5px;padding:4px 0;border-bottom:1px solid var(--line)"><span>'+(r.from?r.from+'歳':'今')+'〜'+to+'歳</span><b class="num">月 '+yen(r.monthly)+'</b></div>'; }).join('');
  return '<div class="card" style="margin-top:-4px"><div class="row between"><div style="font-weight:650">期間別の'+nm+(has?'':' <span class="badge na">未設定</span>')+'</div><button class="btn sm '+(has?'':'primary')+'" data-act="period-edit" data-g="'+g+'">'+(has?'期間と金額を変更':'期間別に設定')+'</button></div>'+
    '<div class="sub" style="margin:4px 0 6px">'+(has?'区切りの年齢と月額を自由に変えて試算できます。':'今の登録内容から見た'+nm+'の流れです。「期間別に設定」で、区切りの年齢と月額を自由に決められます。')+'</div>'+lines+'</div>';
}
function periodRowsHtml(rows){

    return '<div class="row" style="gap:8px;align-items:flex-end;margin:6px 0" data-prow="'+i+'">'+
      '<label style="flex:0 0 96px"><span style="font-size:11.5px;color:var(--ink-3)">'+(i===0?'開始':'何歳から')+'</span>'+(i===0?'<div class="inp" style="display:flex;align-items:center;justify-content:center;color:var(--ink-2)">今</div>':'<div class="unit-wrap"><input class="inp r num" inputmode="numeric" data-pf="from" value="'+esc(r.from||'')+'"><em>歳</em></div>')+'</label>'+
      '<label style="flex:1"><span style="font-size:11.5px;color:var(--ink-3)">月額（今日の物価）</span><div class="unit-wrap"><input class="inp r num" inputmode="decimal" data-pf="monthly" value="'+esc(r.monthly===null||r.monthly===undefined?'':r.monthly)+'"><em>円</em></div></label>'+
      (i===0?'<span style="width:44px"></span>':'<button type="button" class="icon-btn" data-act="period-rm" data-i="'+i+'" aria-label="この期間を削除">×</button>')+'</div>';
  }).join('');

var periodState=null;

    var f=rw.querySelector('[data-pf="from"]'), m=rw.querySelector('[data-pf="monthly"]');
    out.push({from:i===0?null:parseNum(f&&f.value), monthly:parseNum(m&&m.value)}); });

}

    '<div id="prows">'+periodRowsHtml(rows)+'</div>'+
    '<button type="button" class="btn sm" data-act="period-add">＋ 区切りを追加</button>'+

    '<p class="sub">金額は今日の物価で入れてください（物価上昇分は自動で増えます）。完全退職年齢による自動の切り替え（退職後の変化率）は、期間別の金額には掛けません。</p>';
  openSheet('期間別の'+nm, body, function(){
    var rs=readPeriodRows(), cur=curAge(), end=+S.assumptions.endAge||100;
    for(var i=0;i<rs.length;i++){
      if(rs[i].monthly===null||rs[i].monthly<0){ toast((i===0?'最初':'区切り'+i)+'の月額を入力してください'); return false; }
      if(i>0&&(!rs[i].from||rs[i].from<=cur||rs[i].from>end)){ toast('区切りの年齢は'+(cur+1)+'〜'+end+'歳で入力してください'); return false; }
      if(i>1&&rs[i].from<=rs[i-1].from){ toast('区切りの年齢は小さい順に入力してください'); return false; }
    }
    var before=E.clone({ex:S.plan.expenses.filter(function(e){return e.group===g;}), rules:groupRules});
    S.plan.expenses=S.plan.expenses.filter(function(e){ return e.group!==g; });
    rs.forEach(function(r,i){
      var to=i<rs.length-1?rs[i+1].from-1:null;
      S.plan.expenses.push({id:uid('ex'), name:nm+'（'+(r.from?r.from+'歳':'今')+'〜'+(to?to+'歳':'')+'）', group:g, amount:Math.round(r.monthly), period:'m', startAge:r.from||null, endAge:to, inflate:true, retireFactor:1, periodPlan:true});
    });
    S.plan.expenseRules=(S.plan.expenseRules||[]).filter(function(r){ return r.target!==g; });
    audit('期間別の'+nm+'を設定', rs.map(function(r){return (r.from||'今')+'〜:月'+Math.round(r.monthly);}).join(' / '), before, null);

function adjustBalForTransfer(m,t,sign){ // 振替でも、月末残高を手入力済みの項目は残高を自動で動かす
  m.entries=m.entries||{};
  [[t.from,-1],[t.to,1]].forEach(function(x){ var it=item(x[0]); if(!it||it.forecast==='insurance') return; var e=m.entries[x[0]]; if(e&&e.bal!==null&&e.bal!==undefined&&e.bal!=='') e.bal=Math.round(+e.bal+x[1]*sign*(+t.amount)); });
}

function localDownload(filename, data){
  var type=/\.json$/.test(filename)?'application/json':'text/csv';
  var blob=new Blob([data],{type:type});
  try{
    var file=new File([blob], filename, {type:type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ navigator.share({files:[file], title:filename}).then(function(){ toast('保存しました'); }).catch(function(){}); return; }
  }catch(e){}
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000); toast('保存しました');
}
function download(filename, data){
  if(PWA_BUILD||!(window.claude&&window.claude.use)){ localDownload(filename, data); return; }
  var u=window.claude.use('downloads');
  u.then(function(dl){
    if(!dl){ localDownload(filename, data); return; }
    return dl.save({filename:filename, data:data}).then(function(r){ if(r&&r.status==='saved') toast('保存しました'); }).catch(function(e){
      if(e&&e.code==='declined') return; toast('保存できませんでした（'+(e&&e.code||'')+'）');
    });
  });
}
function csvEsc(v){ v=v===null||v===undefined?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function monthCsv(months){
  var hist=history(), out=[['年月','資産項目','カテゴリー','予測区分','前月残高','入金','出金','うち振替入','うち振替出','評価増減','未区分','月末残高','入力状態','確定'].join(',')];
  hist.forEach(function(m){ if(months&&months.indexOf(m.ym)<0) return; m.rows.forEach(function(r){ out.push([m.ym,r.name,r.category,FC_LABEL[r.forecast],r.prev===null?'':Math.round(r.prev),Math.round(r.inn),Math.round(r.out),Math.round(r.trIn),Math.round(r.trOut),Math.round(r.val),Math.round(r.unc),r.end===null?'':Math.round(r.end),r.status,m.closed?'確定':'下書き'].map(csvEsc).join(',')); }); });
  return '﻿'+out.join('\r\n');
}

    case 'go': if(el.getAttribute('data-to')==='ins') ui.insId=null; go(el.getAttribute('data-to')); break;

document.addEventListener('change', function(ev){
  var el=ev.target;
  if(el.closest&&el.closest('#sheetForm')&&document.getElementById('penCalc')){ updatePenCalc(); }
  if(el.getAttribute('data-act-change')==='wi-type'){ var f=document.getElementById('wi-fields'); var tmp=document.createElement('div'); tmp.innerHTML=changeForm({type:el.value}); f.innerHTML=tmp.querySelector('#wi-fields').innerHTML; return; }
  if(el.getAttribute('data-act-change')==='import-json'){ importJson(el.files&&el.files[0]); el.value=''; return; }
  if(el.hasAttribute('data-mi')){
    var id=el.getAttribute('data-mi'), k=el.getAttribute('data-k'), m=S.months[ui.month];
    var e=m.entries[id]=m.entries[id]||{}; var before=E.clone(e);
    var v=toYen(el.value, ui.unit);
    if(k==='bal'&&el.classList.contains('auto')&&v!==null){ var cr=history().filter(function(x){return x.ym===ui.month;})[0]; var rr=cr&&cr.rows.filter(function(x){return x.id===id;})[0]; if(rr&&Math.round(rr.end)===v) return; }
    if(v!==null&&k!=='bal'&&v<0){ toast('入金・出金は0以上で入力してください'); el.value=fromYen(e[k],ui.unit); return; }
    // 入金・出金を変えたら、月末残高をその差額だけ自動で動かす（残高を手入力済みの場合も）
    if(k!=='bal'){ var hasBal=e.bal!==null&&e.bal!==undefined&&e.bal!=='';
      if(hasBal){ var d=((k==='in'?(v||0):(+e.in||0))-(+e.in||0))-((k==='out'?(v||0):(+e.out||0))-(+e.out||0)); e.bal=Math.round(+e.bal+d);
        var bi=document.querySelector('[data-mi="'+id+'"][data-k="bal"]'); if(bi) bi.value=fromYen(e.bal,ui.unit); } }
    e[k]=v; delete e.noChange;
    if(m.closed) audit('確定済みの月を修正', ymLabel(ui.month)+' '+(item(id)||{}).name, before, E.clone(e));
    save(); updateMonthDerived(); return;
  }
  if(el.getAttribute('data-bind')==='tableMonth'){ ui.month=el.value; render(); return; }
  if(el.hasAttribute('data-asm')){
    var A=S.assumptions, k2=el.getAttribute('data-asm'), n=parseNum(el.value);
    var before2=E.clone(A);
    if(k2==='scn'){ if(n===null) return; A.scenarios[el.getAttribute('data-k')][el.getAttribute('data-f')]=n/100; }
    else if(k2==='tau'){ A.tau=Math.max(0,Math.min(0.6,(n||0)/100)); }
    else if(k2==='pensionGrowth'){ A.pensionGrowth=n===null?null:n/100; }
    else if(k2==='retireAge'){ if(n===null||n<curAge()||n<40||n>85){ toast('転職年齢は現在年齢以上で入力してください'); el.value=A.retireAge; return; } A.retireAge=Math.round(n); if(A.fullRetireAge!==null&&A.fullRetireAge!==undefined&&A.fullRetireAge<A.retireAge) A.fullRetireAge=A.retireAge; }
    else if(k2==='fullRetireAge'){ if(n===null||n<curAge()||n>90){ toast('完全退職年齢を確認してください'); el.value=E.fullRetireOf(A); return; } A.fullRetireAge=Math.round(n); if(A.retireAge>A.fullRetireAge) A.retireAge=A.fullRetireAge; }
    else if(k2==='jobChangeRate'){ A.jobChangeRate=(n||0)/100; }
    else if(k2==='endAge'){ if(n===null||n<=curAge()||n>110){ toast('計算終了年齢を確認してください'); el.value=A.endAge; return; } A.endAge=Math.round(n); }
    else if(k2==='defenseMonths'){ A.defenseMonths=Math.max(0,n||0); }
    audit('前提条件を変更', k2, before2, E.clone(A));
    save(); if(k2==='retireAge'||k2==='fullRetireAge'){ render(); } else renderForecastOut(); return;
  }
  if(el.hasAttribute('data-pgf')){
    var f2=el.getAttribute('data-pgf'), p=policy('pgf'), bf=E.clone(p.sim), nv=parseNum(el.value);
    if(f2==='fxGrowth'){ p.sim.fxGrowth=(nv||0)/100; }
    else if(f2==='rate2'){ p.sim.rate2=nv===null?null:nv/100; }
    else if(f2==='rateN'){ if(nv===null||nv<-5||nv>15){ toast('試算年率は−5〜15%で入力してください'); el.value=(p.sim.rate*100).toFixed(2); return; } p.sim.rate=nv/100; }
    else if(f2==='fxN'){ if(nv===null||nv<=0){ toast('為替は0円より大きい値を入力してください'); el.value=p.sim.fx; return; } p.sim.fx=nv; }
    else return;
    audit(''+insLabel('pgf')+'試算条件を変更','試算条件のみ（契約条件は不変）',bf,E.clone(p.sim)); save(); render(); return;
  }
  if(el.hasAttribute('data-prof')){
    var nv2=parseNum(el.value), k3=el.getAttribute('data-prof');
    if(k3==='birthYear'&&(!nv2||nv2<1920||nv2>2010)){ toast('生まれた年を確認してください'); el.value=S.profile.birthYear; return; }
    var b3=E.clone(S.profile); S.profile[k3]=nv2; audit('プロフィールを変更',k3,b3,E.clone(S.profile)); save(); return;
  }
});

function importJson(file){
  if(!file) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d||!d.assetItems||!d.months||!d.insurance) throw new Error('LIFE DESIGN のバックアップ形式ではありません');
      var n=Object.keys(d.months).length;
      confirmSheet('JSONから復元','「'+esc(file.name)+'」（'+n+'か月分・資産項目'+d.assetItems.length+'件）で現在のデータを置き換えますか？','復元する',function(){
        var rev=S.meta.rev||0; S=migrate(d); S.meta.rev=Math.max(rev,S.meta.rev||0); audit('JSONから復元', file.name); save(); toast('復元しました'); go('home');
      }, true);
    }catch(e){ ui.prefsMsg='<div class="note warn">読み込めませんでした：'+esc(e.message)+'</div>'; render(); }
  };
